  ddm_proscription_climate_low_desc: "The realm has begun to expect political enemies to be publicly hunted."
  ddm_proscription_climate_medium: "Deep Climate of Proscription"
  ddm_proscription_climate_medium_desc: "Fear of appearing on a ruler's list now hangs over political life."
  ddm_proscription_climate_high: "Realm of Proscriptions"
  ddm_proscription_climate_high_desc: "The ruler's lists have become an institution of terror, effective but politically corrosive."
  ddm_proscription_hunter_grateful_opinion: "Rewarded My Proscription Service"
  ddm_proscription_ruler_rewarded_opinion: "Grateful for My Service"
  ddm_proscription_target_warned_opinion: "Warned Me About the Hunters"

  ddm_manager.5200.t: "The Writ Is Fulfilled"
  ddm_manager.5200.desc: "[scope:ddm_proscription_hunter_event.GetShortUIName] has seized [scope:ddm_proscription_target_event.GetShortUIName] under my proscription and delivered the captive into my hands. The promised reward is honored, and the realm has another reason to believe my lists carry weight."
  ddm_manager.5200.a: "Bring me the prisoner."
  ddm_manager.5201.t: "A Name Struck from the List"
  ddm_manager.5201.desc: "[scope:ddm_proscription_hunter_event.GetShortUIName] has killed [scope:ddm_proscription_target_event.GetShortUIName] while carrying out my proscription. The bounty is paid and the warning to every would-be conspirator is unmistakable."
  ddm_manager.5201.a: "The writ is satisfied."
  ddm_manager.5202.t: "Blood Drawn, Quarry Escapes"
  ddm_manager.5202.desc: "[scope:ddm_proscription_hunter_event.GetShortUIName] reached [scope:ddm_proscription_target_event.GetShortUIName] but failed to finish the writ. The target escaped wounded. The proscription remains active."
  ddm_manager.5202.a: "Keep hunting."
  ddm_manager.5203.t: "A Hunter Falls"
  ddm_manager.5203.desc: "The hunt turned against [scope:ddm_proscription_hunter_event.GetShortUIName]. [scope:ddm_proscription_target_event.GetShortUIName] killed the hunter and remains at large. A public writ can inspire fear, but it cannot guarantee obedience or competence."
  ddm_manager.5203.a: "Then send others."

  ddm_proscription_alertness_1: "Alerted Quarry"
  ddm_proscription_alertness_1_desc: "This target survived a hunt and has tightened personal security. Each evasion makes later proscription attempts harder."
  ddm_proscription_alertness_2: "Under Guard"
  ddm_proscription_alertness_2_desc: "Two survived attempts have taught this target to expect another."
  ddm_proscription_alertness_3: "Hardened Quarry"
  ddm_proscription_alertness_3_desc: "Repeated failed hunts have made this target difficult to approach unseen."
  ddm_proscription_alertness_4: "Fortified Quarry"
  ddm_proscription_alertness_4_desc: "The proscribed target has survived enough attempts to maintain severe personal security."
  ddm_proscription_alertness_5: "Maximum Alertness"
  ddm_proscription_alertness_5_desc: "Five political hunts have failed, giving this target the maximum alertness represented by the current writ. This is not immunity: the writ remains active until revoked, resolved, or the quarry earns Defied the Writ after eight defenses inside one year."

  DDM_UI_BABY_TITLE:0 "I'm Just a Baby"
  DDM_UI_BABY_DESC:0 "A very young ruler may establish a loyal starter household once. Five capable councillors and five household specialists are brought to court, each with at least 14 in every skill and stronger aptitude for the job they were recruited to perform."
  DDM_UI_BABY_BUTTON:0 "I'm Just a Baby"
  DDM_UI_BABY_TT:0 "Create a one-time loyal court: Chancellor, Marshal, Steward, Spymaster, realm priest/Hogon equivalent, Tutor, Wet Nurse, Physician, Seneschal and Master of the Horse. The office attempts to place each specialist in the matching position when your government allows it."
  DDM_BABY_MODE_TOAST:0 "A Loyal Court Gathers Around the Child"
  ddm_baby_court_loyalty_opinion:0 "Sworn to the Child Ruler"
  ddm_baby_ruler_gratitude_opinion:0 "Guardian of My Childhood Court"

  DDM_UI_HEIR_COUNCIL_TITLE: "继承 Council"
  DDM_UI_HEIR_COUNCIL_DESC: "Household numbers record parentage; they do not decide inheritance. The council below independently asks four constituencies which of my children they consider the strongest successor, using DDM's competence, bloodline and social-regard logic plus each group's actual opinion of the candidate."
  DDM_UI_HEIR_PRIMARY_TITLE: "Primary / Realm Heir"
  DDM_UI_HEIR_PLAYER_TITLE: "Player Heir"
  DDM_UI_HEIR_CURRENT_ROW: "#V [Character.GetShortUINameNoTooltip]#! — age [Character.GetAge]"
  DDM_UI_HEIR_NONE: "None currently identified."
  DDM_UI_HEIR_WHO_WANTS: "Who should inherit?"
  DDM_UI_HEIR_COURT: "Courtiers"
  DDM_UI_HEIR_HOUSE: "House"
  DDM_UI_HEIR_DYNASTY: "Dynasty"
  DDM_UI_HEIR_VASSALS: "Vassals"
  DDM_UI_HEIR_COURT_ROW: "[Character.GetShortUINameNoTooltip] — court score #V [Character.MakeScope.Var('ddm_heir_court_score').GetValue|0]#!"
  DDM_UI_HEIR_HOUSE_ROW: "[Character.GetShortUINameNoTooltip] — house score #V [Character.MakeScope.Var('ddm_heir_house_score').GetValue|0]#!"
  DDM_UI_HEIR_DYNASTY_ROW: "[Character.GetShortUINameNoTooltip] — dynasty score #V [Character.MakeScope.Var('ddm_heir_dynasty_score').GetValue|0]#!"
  DDM_UI_HEIR_VASSAL_ROW: "[Character.GetShortUINameNoTooltip] — vassal score #V [Character.MakeScope.Var('ddm_heir_vassal_score').GetValue|0]#!"
  DDM_UI_HEIR_FORCE_TITLE: "Screw the Rules — Force a Designated Heir"
  DDM_UI_HEIR_FORCE_DESC: "Choose one of my living children. DDM uses CK3's unsafe designated-heir effect, bypassing ordinary designation-law restrictions. This is intentionally stronger than vanilla and can overturn gender, legitimacy and succession expectations."
  DDM_UI_HEIR_CANDIDATE_ROW: "#V [Character.GetShortUINameNoTooltip]#! — age [Character.GetAge] • merit [Character.MakeScope.Var('ddm_heir_dynasty_score').GetValue|0]"
  DDM_UI_HEIR_CANDIDATE_PAGE: "Children [GetPlayer.MakeScope.Var('ddm_heir_candidate_page_display').GetValue|0] / [GetPlayer.MakeScope.Var('ddm_heir_candidate_pages_display').GetValue|0]"
  DDM_UI_HEIR_FORCE_BUTTON: "Force Heir"
  DDM_UI_HEIR_FORCE_TT: "Force this child to be my designated realm heir even when normal realm laws would not permit designation."
  DDM_UI_HEIR_FORCED_TOAST: "The 继承 Is Ordered"
  DDM_UI_HEIR_PLAYER_NOTE: "#weak CK3 derives the player heir separately from title succession and dynasty-continuation rules. In ordinary dynastic landed play, forcing one of my own children as designated heir normally makes the primary and player heir converge; this panel shows both so any divergence is visible instead of being hidden. DDM does not perform a dangerous post-death player-character swap.#!"
  DDM_UI_SORT_DEVELOPMENT_TT: "Sort titles by development."
  DDM_UI_SORT_FAITH_TT: "Sort titles by faith alignment/status."
  DDM_UI_SORT_CULTURE_TT: "Sort titles by culture alignment/status."
  DDM_UI_REVIEW_SORT_VALUE_TT: "Sort dynasty review candidates by overall DDM value."
  DDM_UI_REVIEW_SORT_QUALITY_TT: "Sort by hereditary/congenital quality."
  DDM_UI_REVIEW_SORT_MERIT_TT: "Sort by competence and governance merit."
  DDM_UI_REVIEW_SORT_SAFETY_TT: "Sort by succession/realm safety."
  DDM_UI_REVIEW_SORT_REGARD_TT: "Sort by family regard."
  DDM_UI_REVIEW_SORT_LAND_TT: "Sort by current landed position."
  DDM_UI_REVIEW_SORT_AGE_TT: "Sort by age."
  DDM_UI_REVIEW_SORT_REVERSE_TT: "Reverse the current dynasty-review ordering and return to page 1."
  # 2.5.0 — relationship proscriptions
  ddm_proscribe_unfaithful_lover_interaction: "Proscribe Unfaithful Lover"
  ddm_proscribe_unfaithful_lover_interaction_desc: "Put a private writ on [recipient.GetShortUIName] for taking another Lover or Soulmate while bound to me. The office gets a monthly dispatch opportunity; incoming pressure can allow 4, 8 or 12 attempts per year. Each hunter must defeat [recipient.GetHerHim] in a #V non-lethal duel#! before [recipient.GetSheHe] can be delivered to my dungeon."
  ddm_revoke_love_proscription_interaction: "Revoke Lover Proscription"
  ddm_revoke_love_proscription_interaction_desc: "Withdraw my relationship writ against [recipient.GetShortUIName]."
  ddm_love_proscription_actor_free_tt: "I must be free to issue and enforce a relationship writ."
  ddm_love_proscription_target_free_tt: "The target must not already be imprisoned."
  ddm_love_proscription_target_defied_tt: "This character has Defied the Writ. DDM will not issue a political or discretionary proscription against them, and relationship bounty hunters refuse contracts until that protection expires."
  DDM_LOVE_PROSCRIPTION_ISSUED_TOAST: "An Unfaithful Lover Has Been Proscribed"

  ddm_bounty_survivor_1: "Bounty Survivor I"
  ddm_bounty_survivor_1_desc: "One hired hunter has already failed to bring this character in during the current survivor window."
  ddm_bounty_survivor_2: "Bounty Survivor II"
  ddm_bounty_survivor_2_desc: "Two hired hunters have failed. The quarry is gaining a reputation for being much harder to collect than the writ suggests."
  ddm_bounty_survivor_3: "Bounty Survivor III"
  ddm_bounty_survivor_3_desc: "Three hunters have been beaten back. Anyone taking the next contract knows exactly what happened to the first three."
  ddm_bounty_survivor_4: "Bounty Survivor IV"
  ddm_bounty_survivor_4_desc: "Four hunters have failed inside one year. Even without formal immunity, the character's survival has become a public warning."
  ddm_bounty_survivor_5: "Bounty Survivor V"
  ddm_bounty_survivor_5_desc: "Five hunters have failed inside the same survivor year. The quarry is becoming an institution in the bounty world."
  ddm_bounty_survivor_6: "Bounty Survivor VI"
  ddm_bounty_survivor_6_desc: "Six hunters have failed. Taking the writ now means knowingly following a trail of defeated professionals."
  ddm_bounty_survivor_7: "Bounty Survivor VII"
  ddm_bounty_survivor_7_desc: "Seven hunters have failed. One more successful defense can make the writ commercially untouchable."
  ddm_bounty_survivor_8: "Bounty Survivor VIII"
  ddm_bounty_survivor_8_desc: "Eight hunters have failed inside one year. If protection is enabled and pressure is not Relentless, the character has Defied the Writ."
  ddm_defied_the_writ: "Defied the Writ"
  ddm_defied_the_writ_desc: "Eight bounty hunters failed in one year. Active DDM writs were torn up, and relationship-writ hunters refuse another contract against this character for three years."
  DDM_BOUNTY_SURVIVED_TOAST: "Another Bounty Hunter Has Failed"
  ddm_manager.5303.t: "Defied the Writ"
  ddm_manager.5303.desc: "Eight hired hunters have come for me within a year, and eight have failed. The stories now outweigh the reward. Every active DDM writ against me is struck through, and for three years neither political proscriptions nor relationship bounty contracts may be opened against me."
  ddm_manager.5303.a: "Let them remember the eight who tried."

  ddm_manager.5300.t: "A Hunter at the Door"
  ddm_manager.5300.desc: "A hired blade arrives under [scope:ddm_love_proscriber.GetShortUINamePossessive] writ. [scope:ddm_love_bounty_hunter.GetShortUIName] does not claim the right to kill me — only to defeat me, bind me, and carry me back to answer for my infidelity."
  ddm_manager.5300.a: "Then earn your bounty."
  ddm_manager.5300.a.tt: "#N A non-lethal single combat begins.#! If the bounty hunter wins, you are imprisoned by [scope:ddm_love_proscriber.GetShortUIName] as a writ hostage. If you win, this attempt fails; another monthly opportunity may follow subject to your incoming-pressure cap."
  ddm_manager.5300.b: "The challenge cannot be fought today."

 ddm_select_preferred_bounty_hunter_interaction:0 "Assign as Preferred Hunter"
 ddm_select_preferred_bounty_hunter_interaction_desc:0 "Use [recipient.GetShortUIName] first whenever my Bounty Office answers a relationship writ. #BOLD Level:#! [recipient.MakeScope.Var('ddm_hunter_level').GetValue|0]  #BOLD XP:#! [recipient.MakeScope.Var('ddm_hunter_xp').GetValue|0]  #BOLD Record:#! [recipient.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[recipient.MakeScope.Var('ddm_hunter_losses').GetValue|0]L  #BOLD Live Captures:#! [recipient.MakeScope.Var('ddm_hunter_live_captures').GetValue|0]. If unavailable, another veteran is selected automatically."
 ddm_train_bounty_hunter_gold_interaction:0 "Fund Hunter Training — Gold"
 ddm_train_bounty_hunter_gold_interaction_desc:0 "Spend 250 [gold|E] on [recipient.GetShortUIName]’s equipment, travel and field training. #BOLD Level:#! [recipient.MakeScope.Var('ddm_hunter_level').GetValue|0]  #BOLD XP:#! [recipient.MakeScope.Var('ddm_hunter_xp').GetValue|0]  #BOLD Record:#! [recipient.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[recipient.MakeScope.Var('ddm_hunter_losses').GetValue|0]L. Gains 25 XP and Prowess."
 ddm_train_bounty_hunter_prestige_interaction:0 "Commission Hunter Training — Prestige"
 ddm_train_bounty_hunter_prestige_interaction_desc:0 "Spend 500 [prestige|E] on [recipient.GetShortUIName]’s contacts, reputation and martial instruction. #BOLD Level:#! [recipient.MakeScope.Var('ddm_hunter_level').GetValue|0]  #BOLD XP:#! [recipient.MakeScope.Var('ddm_hunter_xp').GetValue|0]  #BOLD Record:#! [recipient.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[recipient.MakeScope.Var('ddm_hunter_losses').GetValue|0]L. Gains 30 XP and Martial."
 ddm_train_bounty_hunter_piety_interaction:0 "Sanctify Hunter Training — Piety"
 ddm_train_bounty_hunter_piety_interaction_desc:0 "Spend 300 [piety|E] on [recipient.GetShortUIName]’s networks, informants and discipline. #BOLD Level:#! [recipient.MakeScope.Var('ddm_hunter_level').GetValue|0]  #BOLD XP:#! [recipient.MakeScope.Var('ddm_hunter_xp').GetValue|0]  #BOLD Record:#! [recipient.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[recipient.MakeScope.Var('ddm_hunter_losses').GetValue|0]L. Gains 25 XP and Intrigue."
 ddm_train_bounty_hunter_elite_interaction:0 "Elite Hunter Preparation"
 ddm_train_bounty_hunter_elite_interaction_desc:0 "Spend 500 [gold|E], 750 [prestige|E] and 500 [piety|E] on comprehensive preparation for [recipient.GetShortUIName]. #BOLD Level:#! [recipient.MakeScope.Var('ddm_hunter_level').GetValue|0]  #BOLD XP:#! [recipient.MakeScope.Var('ddm_hunter_xp').GetValue|0]  #BOLD Record:#! [recipient.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[recipient.MakeScope.Var('ddm_hunter_losses').GetValue|0]L. Gains 75 XP and broad hunting skills."

 ddm_bounty_office_hunter:0 "Bounty Office Hunter"
 ddm_bounty_office_hunter_desc:0 "A retained hunter whose XP, level, attempts, wins, losses, live captures and kills persist across contracts."

  ddm_ransom_writ_hostage_interaction: "Demand Writ Ransom"
  ddm_ransom_writ_hostage_interaction_desc: "Demand the tiered writ ransom from [recipient.GetShortUIName]. The recorded sponsor—spouse, parent, or origin ruler—pays first when available, and the full demand can drive that sponsor into debt. Current demand: [recipient.MakeScope.Var('ddm_writ_ransom_amount').GetValue|0] [gold|E]."
  ddm_extort_writ_hostage_interaction: "Extort Writ Hostage"
  ddm_extort_writ_hostage_interaction_desc: "Keep [recipient.GetShortUIName] imprisoned while extracting Gold, Prestige and Piety under threat of further punishment."
  ddm_force_writ_hostage_courtier_interaction: "Force into My Court"
  ddm_force_writ_hostage_courtier_interaction_desc: "Release [recipient.GetShortUIName] only on condition that [recipient.GetSheHe] joins my court. Writ Hostages retain their Retrieval War consequences; ordinary unlanded prisoners can also be compelled into service."
  ddm_force_writ_hostage_vassal_interaction: "Force Vassalage"
  ddm_force_writ_hostage_vassal_interaction_desc: "Release [recipient.GetShortUIName] only after forcing [recipient.GetHerHim] beneath my rule as a vassal. A successful Retrieval War can restore the previous political state."
  ddm_force_writ_hostage_tributary_interaction: "Force Tributary Status"
  ddm_force_writ_hostage_tributary_interaction_desc: "Release [recipient.GetShortUIName] only after imposing a tributary relationship. A successful Retrieval War ends the DDM-created tributary status."
  ddm_force_writ_hostage_abdication_interaction: "Force Abdication to Me"
  ddm_force_writ_hostage_abdication_interaction_desc: "Force [recipient.GetShortUIName] to surrender every county-or-higher title currently held directly to me. DDM records those titles so a successful Retrieval War can restore them."
  ddm_set_writ_abdication_beneficiary_interaction: "Set as Abdication Beneficiary"
  ddm_set_writ_abdication_beneficiary_interaction_desc: "Remember [recipient.GetShortUIName] as the person who should receive titles from my next forced Writ Hostage abdication."
  ddm_force_writ_hostage_abdication_beneficiary_interaction: "Force Abdication to Chosen Beneficiary"
  ddm_force_writ_hostage_abdication_beneficiary_interaction_desc: "Force [recipient.GetShortUIName] to surrender every county-or-higher title to my selected abdication beneficiary. Select that beneficiary first by right-clicking the desired character."
  DDM_WRIT_ABDICATION_BENEFICIARY_SET: "Abdication beneficiary selected"
  ddm_blind_prisoner_interaction: "Blind Prisoner"
  ddm_blind_prisoner_interaction_desc: "Blind [recipient.GetShortUIName] without requiring the cultural access normally used by the vanilla interaction. Vanilla physical consequences still apply."
  ddm_castrate_prisoner_interaction: "Castrate Prisoner"
  ddm_castrate_prisoner_interaction_desc: "Castrate [recipient.GetShortUIName] without requiring the cultural access normally used by the vanilla interaction. Vanilla physical consequences still apply."

