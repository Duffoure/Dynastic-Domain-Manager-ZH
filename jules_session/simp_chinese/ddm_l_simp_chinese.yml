  DDM_UI_HUNTER_ROW_STATS:0 "Level [Character.MakeScope.Var('ddm_hunter_level').GetValue|0]  •  XP [Character.MakeScope.Var('ddm_hunter_xp').GetValue|0]  •  [Character.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[Character.MakeScope.Var('ddm_hunter_losses').GetValue|0]L  •  Live [Character.MakeScope.Var('ddm_hunter_live_captures').GetValue|0]  •  Kills [Character.MakeScope.Var('ddm_hunter_kills').GetValue|0]  •  Prowess [Character.GetProwess] / Martial [GuiScope.SetRoot(Character.MakeScope).ScriptValue('ddm_ui_martial_value')|0] / Intrigue [GuiScope.SetRoot(Character.MakeScope).ScriptValue('ddm_ui_intrigue_value')|0]"
  DDM_UI_HUNTER_ROSTER_HELP:0 "#help These are your actual persistent Bounty Office hunters from #BOLD both political and relationship writs#!. A political volunteer is not registered merely for answering the call; the character joins this roster once they actually take a hunt assignment. Surviving hunters remain professionals across later contracts even if they serve as vassals or in another court. Click #BOLD Manage#! or right-click the portrait to train them, make one Preferred, or clear that preference. Sorting changes only the display; XP, wins, losses, captures and kills are permanent career records.#!"
  DDM_HUNTER_DISPATCH_TOAST:0 "[scope:ddm_love_bounty_hunter.GetShortUIName] takes the writ"
  DDM_HUNTER_CAPTURE_TOAST:0 "[scope:ddm_love_bounty_hunter.GetShortUIName] delivered the target alive"
  DDM_HUNTER_DEFEAT_TOAST:0 "[scope:ddm_love_bounty_hunter.GetShortUIName] was defeated"

  DDM_UI_HUNTER_MANAGE:0 "Manage"
  DDM_UI_HUNTER_MANAGE_TT:0 "Open this hunter's Bounty Office management panel for training, career information and Preferred Hunter assignment."
  ddm_manager.5320.t:0 "Bounty Office: [scope:ddm_managed_hunter_event.GetShortUINameNoTooltip]"
  ddm_manager.5320.desc:0 "#BOLD Level:#! [scope:ddm_managed_hunter_event.MakeScope.Var('ddm_hunter_level').GetValue|0]  •  #BOLD XP:#! [scope:ddm_managed_hunter_event.MakeScope.Var('ddm_hunter_xp').GetValue|0]\n#BOLD Record:#! [scope:ddm_managed_hunter_event.MakeScope.Var('ddm_hunter_wins').GetValue|0]W–[scope:ddm_managed_hunter_event.MakeScope.Var('ddm_hunter_losses').GetValue|0]L  •  Captures: [scope:ddm_managed_hunter_event.MakeScope.Var('ddm_hunter_live_captures').GetValue|0]  •  Kills: [scope:ddm_managed_hunter_event.MakeScope.Var('ddm_hunter_kills').GetValue|0]\n\nTrain the hunter directly here, or make them the Office's Preferred Hunter for future assignments."
  ddm_manager.5320.a:0 "Fund field training — 250 Gold"
  ddm_manager.5320.b:0 "Commission martial training — 500 Prestige"
  ddm_manager.5320.c:0 "Sanctify intelligence training — 300 Piety"
  ddm_manager.5320.d:0 "Elite preparation — 500 Gold / 750 Prestige / 500 Piety"
  ddm_manager.5320.e:0 "Make Preferred Hunter"
  ddm_manager.5320.f:0 "Return to the Office"

  DDM_UI_EDUCATE_REALM_TITLE:0 "Educate the Realm"
  DDM_UI_EDUCATE_REALM_DESC:0 "Force a cultural breakthrough instead of waiting decades for the normal innovation grind. The scarce resource is your ruler's lifetime opportunity, not Gold, Prestige, Piety or Renown. Dukes discover #P 1#! random available innovation per use, Kings #P 2#!, and Emperors/Hegemons #P 3#!."
  DDM_UI_EDUCATE_REALM_STATUS:0 "Lifetime breakthroughs remaining: #V [GetPlayer.MakeScope.Var('ddm_educate_realm_remaining').GetValue|0]/4#!  •  Innovations this use: #V [GetPlayer.MakeScope.Var('ddm_educate_realm_breakthrough_count').GetValue|0]#!"
  DDM_UI_EDUCATE_REALM_BUTTON:0 "Educate the Realm"
  DDM_UI_EDUCATE_REALM_TT:0 "Requires a Duchy-tier title or higher. Can be used four times per ruler lifetime. No currency cost. Only innovations currently available to your culture can be selected by the game."
  ddm_manager.5400.t:0 "Educate the Realm"
  ddm_manager.5400.desc:0 "A discovery does not always wait for a treasury to be full or a scholar to finish a progress bar. Sometimes a ruler creates the conditions for a breakthrough and the realm simply moves.\n\nYou have #V [ROOT.Char.MakeScope.Var('ddm_educate_realm_remaining').GetValue|0]#! lifetime uses remaining. At your present rank, this program can immediately discover #P [ROOT.Char.MakeScope.Var('ddm_educate_realm_breakthrough_count').GetValue|0]#! random innovations currently available to your culture.\n\n#help A use is consumed by the program, not by spending resources. If fewer eligible innovations remain than your rank allowance, the game simply has fewer discoveries to grant.#!"
  ddm_manager.5400.a:0 "Begin the breakthrough program."
  ddm_manager.5400.b:0 "Not yet."
  DDM_EDUCATE_REALM_TOAST:0 "A breakthrough transforms the realm"
  DDM_UI_SUB_SLAVERY:0 "Slavery"
  DDM_UI_SLAVERY_TITLE:0 "Slavery & Exchange"
  DDM_UI_SLAVERY_FLAVOR:0 "The Living Market is administered here rather than through another Decisions-tab entry. Buy and sell by price or stats, bulk-sell marked slaves to their best bidder, rank slave marriages by child/Apex quality, and administer the slave workforce."
  ddm_manager.5320.g:0 "Clear Preferred Hunter"
  DDM_UI_HUNTER_PREV:0 "Previous"
  DDM_UI_HUNTER_NEXT:0 "Next"
  DDM_UI_HUNTER_PAGE:0 "Page [GetPlayer.MakeScope.Var('ddm_hunter_page_display').GetValue|0] of [GetPlayer.MakeScope.Var('ddm_hunter_pages_display').GetValue|0]"
  DDM_UI_HABSBURG_TITLE:0 "Habsburgs' Creed"
  DDM_UI_HABSBURG_NAV:0 "Habsburgs' Creed"
  DDM_UI_HABSBURG_NAV_TT:0 "Open Habsburgs' Creed: dynasty blood analytics, pedigree loops, consanguinity tiers, and internal-marriage doctrine."
  DDM_UI_HABSBURG_BACK:0 "Back"
  DDM_UI_HABSBURG_BACK_TT:0 "Return to 我的内廷 in the Dynastic Domain Office."
  DDM_UI_HABSBURG_DESC:0 "A persistent dynasty breeding doctrine. When active, DDM periodically marries eligible adult members of your dynasty to other adult dynasts without requiring you to arrange every pairing yourself. The player is never automatically married by the Creed."
  DDM_UI_HABSBURG_OFF:0 "Off"
  DDM_UI_HABSBURG_DYNASTY:0 "Dynasty First"
  DDM_UI_HABSBURG_CLOSE:0 "关闭 Blood"
  DDM_UI_HABSBURG_PURE:0 "Pure Blood"
  DDM_UI_HABSBURG_ABSOLUTE:0 "Absolute Creed"
  DDM_UI_HABSBURG_RUN:0 "Run Creed Sweep"
  DDM_UI_HABSBURG_OFF_TT:0 "Disable autonomous Creed marriages. Existing marriages are not changed."
  DDM_UI_HABSBURG_RUN_TT:0 "Run the active Creed immediately instead of waiting for the annual dynasty sweep."
  DDM_UI_HABSBURG_GUIDE:0 "The Creed is an automation policy, not a one-time match. #V Dynasty First#! keeps marriages internal when legal. #V 关闭 Blood#! pushes toward closer kin. #V Pure Blood#! prioritizes congenital quality inside the dynasty. #V Absolute Creed#! deliberately ignores ordinary faith incest restrictions for eligible adult dynasts. The player is never auto-married."
  DDM_UI_HABSBURG_STATUS_OFF:0 "Creed: #V OFF#!"
  DDM_UI_HABSBURG_STATUS_DYNASTY:0 "Creed: #V DYNASTY FIRST#! — same-dynasty matches are automated when CK3 considers the marriage legal."
  DDM_UI_HABSBURG_STATUS_CLOSE:0 "Creed: #V CLOSE BLOOD#! — the automation heavily favors close and extended relatives while still respecting the loaded game's marriage legality."
  DDM_UI_HABSBURG_STATUS_PURE:0 "Creed: #V PURE BLOOD#! — internal matches are selected primarily for congenital quality, fertility and Pure-blooded while avoiding Inbred when possible."
  DDM_UI_HABSBURG_STATUS_ABSOLUTE:0 "Creed: #V ABSOLUTE#! — adult dynasts marry within the dynasty even when normal faith incest rules would prohibit the match."
  DDM_UI_HABSBURG_DYNASTY_TT:0 "Automate adult same-dynasty marriages, prioritizing congenital quality and fertility while respecting CK3's current marriage rules."
  DDM_UI_HABSBURG_CLOSE_TT:0 "As Dynasty First, but strongly prefer close and extended relatives. CK3's active marriage legality still applies."
  DDM_UI_HABSBURG_PURE_TT:0 "A selective internal-breeding policy. DDM strongly prioritizes the best congenital-quality matches in the dynasty, especially Pure-blooded and Fecund, while still respecting marriage legality."
  DDM_UI_HABSBURG_ABSOLUTE_TT:0 "The extreme doctrine. DDM directly marries adult opposite-sex dynasts and deliberately bypasses normal faith incest restrictions. It still excludes minors, married/betrothed characters and the player."
  DDM_UI_HABSBURG_TOTAL:0 "Creed-arranged marriages this reign: #V [GetPlayer.MakeScope.Var('ddm_habsburg_matches_total').GetValue|0]#!  •  last sweep: #V [GetPlayer.MakeScope.Var('ddm_habsburg_matches_this_sweep').GetValue|0]#!"


  DDM_LOVE_PROSCRIPTION_REVOKED_TOAST: "Relationship Writ Revoked"
  DDM_UI_MATCH_HABSBURG_METER:0 "Habsburg #V [Character.MakeScope.Var('ddm_habsburg_pair_tier').GetValue|0]/5#!  •  shared #V [Character.MakeScope.Var('ddm_habsburg_pair_shared').GetValue|0]#!  •  collapse #V [Character.MakeScope.Var('ddm_habsburg_pair_subject_collapse').GetValue|0]/[Character.MakeScope.Var('ddm_habsburg_pair_partner_collapse').GetValue|0]#!"
  DDM_UI_MATCH_HABSBURG_TT:0 "Four-generation bloodline analysis. Shared is the number of unique ancestors found in both pedigrees. Collapse is repeated ancestor positions in the subject / selected match. Habsburg tiers: 0 none; I 1; II 2–3; III 4–7; IV 8–14; V 15+."
  DDM_UI_HABSBURG_ANALYTICS_TITLE:0 "Dynasty Blood 总簿"
  DDM_UI_HABSBURG_ANALYTICS:0 "在世宗族成员： #V [GetPlayer.MakeScope.Var('ddm_habsburg_living_dynasts').GetValue|0]#!  •  married dynasts: #V [GetPlayer.MakeScope.Var('ddm_habsburg_married_dynasts').GetValue|0]#!  •  same-dynasty spouse rate: #V [GetPlayer.MakeScope.Var('ddm_habsburg_internal_rate').GetValue|0]%#!  •  same-house rate: #V [GetPlayer.MakeScope.Var('ddm_habsburg_same_house_rate').GetValue|0]%#!"
  DDM_UI_HABSBURG_BLOOD_COUNTS:0 "Current blood markers — Inbred: #V [GetPlayer.MakeScope.Var('ddm_habsburg_inbred_dynasts').GetValue|0]#!  •  Pure-blooded: #V [GetPlayer.MakeScope.Var('ddm_habsburg_pure_dynasts').GetValue|0]#!  •  Stabilized Blood V: #V [GetPlayer.MakeScope.Var('ddm_habsburg_stabilized_dynasts').GetValue|0]#!  •  last tier refresh: #V [GetPlayer.MakeScope.Var('ddm_habsburg_tiers_refreshed').GetValue|0]#! dynasts"
  DDM_UI_HABSBURG_REFRESH_ANALYTICS:0 "Refresh 总簿"
  DDM_UI_HABSBURG_REFRESH_ANALYTICS_TT:0 "Recount the current living dynasty and its marriage pattern. This is lightweight and does not alter characters."
  DDM_UI_HABSBURG_REFRESH_TIERS:0 "Refresh Blood Tiers"
  DDM_UI_HABSBURG_REFRESH_TIERS_TT:0 "Recalculate four generations of pedigree collapse for every living dynast and apply Consanguinity I–V. This is intentionally manual for very large dynasties; newborns are updated automatically."
  trait_ddm_consanguinity_1:0 "Consanguinity I"
  trait_ddm_consanguinity_1_desc:0 "Repeated ancestors have begun to fold this character's pedigree inward. DDM derives this tier from four generations of actual ancestry."
  trait_ddm_consanguinity_2:0 "Consanguinity II"
  trait_ddm_consanguinity_2_desc:0 "The same bloodlines recur several times within four generations, producing measurable pedigree collapse."
  trait_ddm_consanguinity_3:0 "Consanguinity III"
  trait_ddm_consanguinity_3_desc:0 "This pedigree is heavily intertwined. Vanilla Inbred is treated as at least this severe when DDM refreshes the bloodline."
  trait_ddm_consanguinity_4:0 "Consanguinity IV"
  trait_ddm_consanguinity_4_desc:0 "An extreme concentration of repeated ancestry has left very few independent branches in the recent pedigree."
  trait_ddm_consanguinity_5:0 "Stabilized Blood V"
  trait_ddm_consanguinity_5_desc:0 "An exceptionally collapsed pedigree has coincided with Pure-blooded. Habsburgs' Creed treats this improbable endpoint as a stabilized bloodline rather than another step of decline."

  ddm_pedigree_loop_report_interaction:0 "Analyze Pedigree Loops"
  ddm_pedigree_loop_report_interaction_desc:0 "Build a four-generation Pedigree Loop Report for this character and open it in Habsburgs' Creed. This is analysis only; it changes no relationships, traits, or marriages."
  DDM_UI_PEDIGREE_TITLE:0 "Pedigree Loop Report"
  DDM_UI_PEDIGREE_ANALYZE_SELF:0 "Analyze Me"
  DDM_UI_PEDIGREE_ANALYZE_SELF_TT:0 "Build the same four-generation loop report for your current character. To inspect someone else, right-click them and choose Analyze Pedigree Loops."
  DDM_UI_PEDIGREE_SUMMARY:0 "[GetPlayer.MakeScope.Var('ddm_pedigree_subject').Char.GetShortUINameNoTooltip] — known ancestor positions #V [GetPlayer.MakeScope.Var('ddm_pedigree_known_positions').GetValue|0]/30#!  •  unique ancestors #V [GetPlayer.MakeScope.Var('ddm_pedigree_unique_ancestors').GetValue|0]#!  •  duplicated positions #V [GetPlayer.MakeScope.Var('ddm_pedigree_collapse').GetValue|0]#!  •  repeated people #V [GetPlayer.MakeScope.Var('ddm_pedigree_repeated_people').GetValue|0]#!"
  DDM_UI_PEDIGREE_LOOPS:0 "True paternal/maternal cross-branch loops: #V [GetPlayer.MakeScope.Var('ddm_pedigree_cross_branch').GetValue|0]#!  •  earliest visible convergence: generation #V [GetPlayer.MakeScope.Var('ddm_pedigree_earliest_convergence').GetValue|0]#!  •  loop severity: #V [GetPlayer.MakeScope.Var('ddm_pedigree_loop_severity').GetValue|0]/5#!. Pedigree collapse is the number of known ancestor positions occupied by somebody already present elsewhere in the same four-generation pedigree."
  DDM_UI_PEDIGREE_NO_LOOPS:0 "No repeated ancestor appears within the four known generations currently available to the game. Unknown ancestors reduce the number of positions that can be evaluated."
  DDM_UI_PEDIGREE_TOP1:0 "Most repeated: #V [GetPlayer.MakeScope.Var('ddm_pedigree_top_1').Char.GetShortUINameNoTooltip]#! — #V [GetPlayer.MakeScope.Var('ddm_pedigree_top_1_count').GetValue|0]×#! within the pedigree"
  DDM_UI_PEDIGREE_TOP2:0 "Next: #V [GetPlayer.MakeScope.Var('ddm_pedigree_top_2').Char.GetShortUINameNoTooltip]#! — #V [GetPlayer.MakeScope.Var('ddm_pedigree_top_2_count').GetValue|0]×#!"
  DDM_UI_PEDIGREE_TOP3:0 "Next: #V [GetPlayer.MakeScope.Var('ddm_pedigree_top_3').Char.GetShortUINameNoTooltip]#! — #V [GetPlayer.MakeScope.Var('ddm_pedigree_top_3_count').GetValue|0]×#!"

  ddm_patron_marry_off_interaction:0 "Arrange Marriage — Patron Authority"
  ddm_patron_marry_off_interaction_desc:0 "Choose a spouse or betrothal for this child. Because one of their parents is fully Owned by you, Dominion treats the household as subject to your marriage authority. The selected pair must still satisfy the loaded game's marriage rules."
  DDM_PATRON_MARRIAGE_SHORTCUT:0 "Patron Marriage"
  DDM_PATRON_MARRIAGE_SHORTCUT_TT:0 "Arrange this child's marriage directly. This shortcut appears because one of their parents is fully Owned by you."
  DDM_PATRON_MARRIAGE_CHILD_AVAILABLE_TT:0 "The child must be available for a marriage arrangement."
