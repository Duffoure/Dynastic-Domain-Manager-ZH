  # Dynastic Kidnapping
  rule_ddm_dynastic_kidnapping: "DDM: Dynastic Kidnapping"
  rule_ddm_dynastic_kidnapping_desc: "Controls DDM kidnapping and how readily AI rulers escalate a serious kidnapping or Writ Hostage dispute into a recovery war. Recovery wars are restricted by relationship importance, military strength, and multi-year cooldowns even on Aggressive AI."
  setting_ddm_kidnap_disabled: "Disabled"
  setting_ddm_kidnap_disabled_desc: "No Dynastic Kidnapping buttons or autonomous DDM kidnapping. Existing authored hostage disputes do not generate new autonomous DDM recovery wars."
  setting_ddm_kidnap_player_only: "Player Only"
  setting_ddm_kidnap_player_only_desc: "The human player may use Dynastic Kidnapping. AI rulers do not initiate kidnapping; AI recovery-war escalation remains conservative and only protects politically important close relations."
  setting_ddm_kidnap_strategic_ai: "Strategic AI"
  setting_ddm_kidnap_strategic_ai_desc: "Default. Nearby AI rulers occasionally attempt a selective abduction. Recovery wars are uncommon: AI protects only its own close family, spouse/consort, heir, or an important Writ target, will not attack a stronger realm, and receives long cooldowns."
  setting_ddm_kidnap_aggressive_ai: "Aggressive AI"
  setting_ddm_kidnap_aggressive_ai_desc: "Nearby AI rulers consider kidnapping more often and may expand a successful plan into a small raid. Recovery wars are also somewhat more likely, but remain strength-gated, importance-gated, and cooldown-limited rather than repeatedly retried."

  ddm_kidnap_interaction: "Kidnap"
  ddm_kidnap_interaction_desc: "Personally lead a covert expedition to seize [recipient.GetShortUIName] and bring [recipient.GetHerHim] into my custody. Married, betrothed and concubine/consort targets are valid, but their existing bonds create nonlinear cost and danger. I may go alone or bring my available knights/champions."
  ddm_kidnap_target_must_be_unlanded_tt: "The target must be unlanded."
  ddm_kidnap_target_must_be_free_tt: "The target must not already be imprisoned."
  ddm_kidnap_target_must_be_single_tt: "Legacy text: relationship status is no longer a kidnapping blocker."
  ddm_kidnap_target_needs_liege_tt: "The target must belong to another ruler's political court."
  ddm_kidnap_target_range_tt: "The target must be within diplomatic range."
  ddm_kidnap_target_foreign_court_tt: "There is no reason to kidnap somebody already in my own court."
  ddm_kidnap_yearly_quota_tt: "Kidnapping capacity remains this ruler-year: at most four successful expeditions and eight total attempts. Every failure grants one replacement attempt."
  ddm_kidnap_operation_active_tt: "A kidnapping expedition is already underway. Another can be launched immediately after the current expedition returns. Single-target operations resolve after roughly 14 days, multi-captive raids after 21 days, and elite sweeps after 30 days."

  DDM_UI_MATCH_FIND_ME: "Best Match for Me"
  DDM_UI_MATCH_FIND_ME_TT: "Find your own best spouse under the currently selected Marriage Planner priority and kinship strategy. This scans only you, then gives you the same top-three recommendations, score breakdown, Next Match, Marry, and Kidnap fallback used for dynasty members. Your own marriage stays outside Dynasty Plan/Marry All so it is always a deliberate choice."
  DDM_UI_MATCH_MY_RESULT: "My Best Match"
  DDM_UI_MATCH_KIDNAP: "Kidnap"
  DDM_UI_MATCH_KIDNAP_TT: "Launch the hostile Kidnap Expedition against this recommendation. Diplomacy and abduction are separate choices. Kidnapping is available for unlanded adults within diplomatic range and outside my court; existing marriages, betrothals and concubinage raise the operation's cost and danger rather than blocking it."

  ddm_manager.4999.t: "Who Rides With Me?"
  ddm_manager.4999.desc: "I will be there when we move on [ddm_kidnap_target.GetName]. My people are ready; the only question is whether I bring the full retinue or trust secrecy and go alone. #V [ROOT.Char.MakeScope.Var('ddm_kidnap_party_count').GetValue|0]#! knights and champions stand ready.\n\n#high Full Retinue:#! Their Prowess strengthens the raid, but if we are caught, everyone who rode with me may share my cell.\n\n#high Go Alone:#! Harder, quieter, and mine alone to answer for if it fails."
  ddm_manager.4999.a: "Bring the retinue."
  ddm_manager.4999.a.flavor: "Use every available knight/champion. More bodies offset difficulty, but a large expedition is also harder to hide when it fails."
  ddm_manager.4999.b: "I go alone."
  ddm_manager.4999.b.flavor: "Remove all knight/champion Prowess from the expedition score. This is the harder route, but only I can be captured."
  ddm_manager.4999.c: "Abandon the plan."

  ddm_manager.5000.t: "A Marriage by Other Means"
  ddm_manager.5000.desc: "Night settles around [ddm_kidnap_target.GetNamePossessive] residence. The routes are watched, my people know their places, and the household has not yet understood what is coming. We can seize the principal target alone, widen the raid to other worthwhile captives, or risk everything on the highest-ranking prizes we can reach.\n\n#weak Marriage, betrothal, and concubinage do not make a target immune; they make the attempt more dangerous and retaliation more likely. A successful raid takes captives into custody but does not dissolve their existing marriages.#!"
  ddm_manager.5000.a: "Take [ddm_kidnap_target.GetHerHim] alone."
  ddm_manager.5000.a.flavor: "#V [ROOT.Char.MakeScope.Var('ddm_kidnap_chance_single').GetValue|0]%#! estimated success. Operational cost: #V [ROOT.Char.MakeScope.Var('ddm_kidnap_gold_cost_single').GetValue|0] Gold#! and #V [ROOT.Char.MakeScope.Var('ddm_kidnap_prestige_cost_single').GetValue|0] Prestige#!. Attached targets can make this dramatically more expensive."
  ddm_manager.5000.b: "Bring back as many worthwhile captives as we can carry."
  ddm_manager.5000.b.flavor: "#V [ROOT.Char.MakeScope.Var('ddm_kidnap_chance_three').GetValue|0]%#! estimated success. Cost: #V [ROOT.Char.MakeScope.Var('ddm_kidnap_gold_cost_three').GetValue|0] Gold#! / #V [ROOT.Char.MakeScope.Var('ddm_kidnap_prestige_cost_three').GetValue|0] Prestige#!. Up to #V [ROOT.Char.MakeScope.Var('ddm_kidnap_capacity').GetValue|0]#! additional worthwhile women can be secured. Existing candidates are preferred; if the region is thin, a variable local fallback scales with expedition size rather than always returning the same number."
  ddm_manager.5000.c: "Sweep for exceptional high-ranking stock."
  ddm_manager.5000.c.flavor: "#V [ROOT.Char.MakeScope.Var('ddm_kidnap_chance_elite').GetValue|0]%#! estimated success. Cost: #V [ROOT.Char.MakeScope.Var('ddm_kidnap_gold_cost_elite').GetValue|0] Gold#! / #V [ROOT.Char.MakeScope.Var('ddm_kidnap_prestige_cost_elite').GetValue|0] Prestige#!. Sweep the political sub-realm for every qualifying high-status noblewoman we can physically secure, up to #V [ROOT.Char.MakeScope.Var('ddm_kidnap_capacity').GetValue|0]#! additional captives. Attached captives compound danger and retaliation."
  ddm_manager.5000.d: "No. This is too much even for me."

  ddm_manager.5002.t: "The Expedition Returns"
  ddm_manager.5002.desc: "By the time the alarm spreads, we are already gone. #V [ROOT.Char.MakeScope.Var('ddm_kidnap_captured_count').GetValue|0]#! captives are brought through my gates and placed in my custody.\n\n#high Captured:#!"
  ddm_manager.5002.c1: "\n• [ddm_kidnap_captured_1.GetFullName]"
  ddm_manager.5002.c2: "\n• [ddm_kidnap_captured_2.GetFullName]"
  ddm_manager.5002.c3: "\n• [ddm_kidnap_captured_3.GetFullName]"
  ddm_manager.5002.c4: "\n• [ddm_kidnap_captured_4.GetFullName]"
  ddm_manager.5002.c5: "\n• [ddm_kidnap_captured_5.GetFullName]"
  ddm_manager.5002.c6: "\n• [ddm_kidnap_captured_6.GetFullName]"
  ddm_manager.5002.c7: "\n• [ddm_kidnap_captured_7.GetFullName]"
  ddm_manager.5002.c8: "\n• [ddm_kidnap_captured_8.GetFullName]"
  ddm_manager.5002.more: "\n• ...and #V [ROOT.Char.MakeScope.Var('ddm_kidnap_captured_more').GetValue|0]#! more captives."
  ddm_manager.5002.war: "\n\n#N The offended realm has answered with force. A Retrieval War has begun to recover the people we took.#!"
  ddm_manager.5002.a: "Bring them inside."
  ddm_manager.5003.t: "The Expedition Breaks Apart"
  ddm_manager.5003.desc: "The approach comes apart before we can secure [ddm_kidnap_target.GetName]. Doors close, guards converge, and I call the retreat before a failed abduction becomes a slaughter. The target remains free, and any wounds taken in the escape are real wounds—not bookkeeping."
  ddm_manager.5003.a: "We will live with the failure."
  ddm_manager.5004.t: "The Raiders Are Taken"
  ddm_manager.5004.desc: "We are discovered before the escape route is clear. Steel comes out, the household closes around us, and the raid becomes a capture of its own. [ddm_kidnap_local_ruler.GetNamePossessive] people take me prisoner along with #V [ROOT.Char.MakeScope.Var('ddm_kidnap_captured_retinue_count').GetValue|0]#! members of my retinue.\n\n#weak The expedition cost is gone and the intended target remains free.#!"
  ddm_manager.5004.a: "This went catastrophically wrong."

  DDM_KIDNAP_RETRIEVAL_WAR_NAME: "War to Recover the Kidnapped"
  DDM_KIDNAP_RETRIEVAL_VICTORY_DESC: "If the rescuing side wins, DDM prisoners taken from that realm are released and returned to the victor's court."
  DDM_KIDNAP_RETRIEVAL_WHITE_PEACE_DESC: "A white peace ends the fighting but does not automatically release the kidnapped prisoners."
  DDM_KIDNAP_RETRIEVAL_DEFEAT_DESC: "If the rescuing side loses, the kidnappings stand and the failed rescuer loses Prestige."
  DDM_KIDNAP_RETRIEVAL_INVALIDATED_DESC: "The recovery war ends because the specific captive who caused it is no longer being held under the defending realm, or one of the principal rulers can no longer continue the war."
  ddm_kidnapped_me_opinion: "Kidnapped Me"
  ddm_kidnapped_family_opinion: "Raided My Family and Court"
  DDM_UI_COMMAND_SCHOOL_TITLE: "Dynastic Command School"
  DDM_UI_COMMAND_SCHOOL_DESC: "Teach my own commander specialties in one realm-wide class instead of repeating the vanilla interaction character by character. Direct children remain eligible as adults; age-10+ wards, court children, dynasty youth in range, and children of my vassals may also attend. Each pupil gets an individual learning roll and can receive at most two DDM-taught commander specialties."
  DDM_UI_COMMAND_SCHOOL_STATS: "My teachable commander specialties: #V [GetPlayer.MakeScope.Var('ddm_commander_school_traits_known').GetValue|0]#!    •    pupils ready now: #V [GetPlayer.MakeScope.Var('ddm_commander_school_eligible_total').GetValue|0]#!"
  DDM_UI_COMMAND_SCHOOL_BALANCED: "Hold Commander School"
  DDM_UI_COMMAND_SCHOOL_BALANCED_TT: "Run one lesson for every currently eligible pupil. Success uses my Martial, Learning, Prowess, personality, and the pupil's aptitude. Failed pupils contribute to one aggregate stress cost after the class. Stress is capped at 75 for the session and cannot push me above 250 total stress. Pass or fail, each pupil waits one year before another DDM lesson."
  DDM_UI_COMMAND_SCHOOL_FREE: "Education Should Be Free"
  DDM_UI_COMMAND_SCHOOL_FREE_TT: "Run the exact same lessons, odds, two-trait limit, and one-year pupil cooldown, but add no stress at all. Education should be free."
