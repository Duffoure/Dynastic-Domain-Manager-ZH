  # DDM 2.0 — Proscriptions
  DDM_UI_SUB_PROSCRIPTIONS: "Proscriptions"
  DDM_UI_PROSCRIPTIONS_TITLE: "Office of Proscriptions"
  DDM_UI_PROSCRIPTIONS_FLAVOR: "Issue political writs against faction members and rebel leaders, or use royal prerogative to proscribe a particular adult who has simply earned your displeasure. Dread, prestige, rank, income, treasury credibility and personal loyalties determine whether hunters answer."
  DDM_UI_PROSCRIPTIONS_STATUS_TITLE: "Authority of the Writ"
  DDM_UI_PROSCRIPTIONS_STATUS: "Active writs: #V [GetPlayer.MakeScope.Var('ddm_proscription_active_count').GetValue|0]#!    Issued: #V [GetPlayer.MakeScope.Var('ddm_proscription_issued_total').GetValue|0]#!    Successful: #P [GetPlayer.MakeScope.Var('ddm_proscription_success_total').GetValue|0]#!    Hollow/failed calls: #N [GetPlayer.MakeScope.Var('ddm_proscription_failure_total').GetValue|0]#!\nProscription Reputation: #V [GetPlayer.MakeScope.Var('ddm_proscription_reputation').GetValue|0]/100#!    Climate of Proscription: #V [GetPlayer.MakeScope.Var('ddm_proscription_climate').GetValue|0]/100#!    Current reward guide: #V [GetPlayer.MakeScope.Var('ddm_proscription_preview_reward').GetValue|0] [gold_i]#!"
  DDM_UI_PROSCRIPTIONS_RESPONSE: "Last writ: #V [GetPlayer.MakeScope.Var('ddm_proscription_last_hunters').GetValue|0]#! hunters answered — approximately #V [GetPlayer.MakeScope.Var('ddm_proscription_last_response_percent').GetValue|0]%#! of those asked. No individual call can exceed an 85% willingness ceiling."
  DDM_UI_PROSCRIPTIONS_ISSUE_TITLE: "Issue Writs"
  DDM_UI_PROSCRIPTIONS_ISSUE_HELP: "Right-click an adult character and choose #V Proscribe#!. Political faction/rebel targets remain available to any landed ruler. Kings and above may also issue discretionary personal writs against anyone, including a spouse. Political writs do not consume the personal annual allowance."
  DDM_UI_PROSCRIPTIONS_FACTIONS: "Proscribe Faction Members"
  DDM_UI_PROSCRIPTIONS_FACTIONS_TT: "Issue a separate proscription against every currently eligible character member of a faction targeting you. The button is disabled when no eligible character member exists; populist county factions become actionable when an actual revolt produces a leader."
  DDM_UI_PROSCRIPTIONS_REBELS: "Proscribe Rebels"
  DDM_UI_PROSCRIPTIONS_REBELS_TT: "Issue writs against every eligible primary enemy currently leading a peasant or vassal rebellion against you. This is the active-war bulk action and can cover multiple simultaneous rebellion wars in one click."
  DDM_UI_PROSCRIPTIONS_HUNTERS_TITLE: "The Hunters"
  DDM_UI_PROSCRIPTIONS_HUNTERS: "Every fourteen days an active writ checks the realm again. If nobody has answered, recruitment repeats; if hunters exist, one normally makes an opposed Intrigue/Martial/Prowess attempt. On success, the current Office policy decides the result: #P Take Alive#! means imprisonment; #N Kill on Sight#! means death."
  DDM_UI_PROSCRIPTIONS_CONSEQUENCES: "A proscribed faction member may abandon the faction before anyone reaches them. Every failed hunt raises the target’s permanent alertness for that writ, making the next attempt harder rather than repeating the same roll forever. A peasant leader captured or slain collapses the uprising. A vassal-revolt leader instead triggers a cohesion check: the rebellion may collapse, or CK3 may replace the leader and the war-level writ transfers to the successor. Repeated use creates a Climate of Proscription: greater fear and deterrence, but worsening general opinion."
  DDM_UI_PROSCRIPTIONS_REFRESH: "Refresh Office"
  DDM_UI_PROSCRIPTIONS_REVOKE_ALL: "Revoke All Writs"
  DDM_UI_PROSCRIPTIONS_PERSONAL_TITLE: "Personal Proscriptions"
  DDM_UI_PROSCRIPTIONS_PERSONAL_STATUS: "Discretionary writs this year: #V [GetPlayer.MakeScope.Var('ddm_personal_proscriptions_year').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_personal_proscription_cap').GetValue|0]#!   •   Remaining: #V [GetPlayer.MakeScope.Var('ddm_personal_proscription_remaining').GetValue|0]#!"
  DDM_UI_PROSCRIPTIONS_PERSONAL_HELP: "Kings/Queens: 6 personal writs per year • Emperors/Empresses: 8 • Hegemons: 12. Manual Proscribe may target any free adult. Automation issues at most one personal writ per month against a rival, nemesis, or someone you personally dislike at -75 Opinion or worse."
  DDM_UI_PROSCRIPTIONS_TAKE_ALIVE: "Take Alive"
  DDM_UI_PROSCRIPTIONS_TAKE_ALIVE_TT: "All successful standard DDM proscription hunts will deliver the target to your dungeon. This applies to currently active political and personal writs."
  DDM_UI_PROSCRIPTIONS_KILL_ON_SIGHT: "Kill on Sight"
  DDM_UI_PROSCRIPTIONS_KILL_ON_SIGHT_TT: "All successful standard DDM proscription hunts will kill the target. This applies to currently active political and personal writs."
  DDM_UI_PROSCRIPTIONS_POLICY_ALIVE: "Current writ policy: TAKE THEM ALIVE"
  DDM_UI_PROSCRIPTIONS_POLICY_DEAD: "Current writ policy: KILL ON SIGHT"
  DDM_UI_PROSCRIPTIONS_AUTO_ENABLE: "Automate Irritants"
  DDM_UI_PROSCRIPTIONS_AUTO_DISABLE: "Stop Automation"
  DDM_UI_PROSCRIPTIONS_AUTO_TT: "Automatically spend your remaining discretionary allowance on rivals, nemeses, or characters your ruler personally dislikes at -75 Opinion or worse. At most one automatic writ is issued each month."
  DDM_UI_BOUNTY_PRESSURE_TITLE: "Incoming Relationship-Bounty Pressure"
  DDM_UI_BOUNTY_PRESSURE_OFF_STATUS: "Current pressure: OFF — relationship writs cannot send bounty hunters after you."
  DDM_UI_BOUNTY_PRESSURE_LIGHT_STATUS: "Current pressure: LIGHT — at most 4 relationship-writ hunters can reach you per year."
  DDM_UI_BOUNTY_PRESSURE_STANDARD_STATUS: "Current pressure: STANDARD — at most 8 relationship-writ hunters can reach you per year."
  DDM_UI_BOUNTY_PRESSURE_HIGH_STATUS: "Current pressure: HIGH — up to 12 monthly relationship-writ hunter attempts per year."
  DDM_UI_BOUNTY_PRESSURE_RELENTLESS_STATUS: "Current pressure: RELENTLESS — up to 12 monthly attempts per year, and eight victories do not grant Defied-the-Writ protection."
  DDM_UI_BOUNTY_PRESSURE_OFF: "Off"
  DDM_UI_BOUNTY_PRESSURE_LIGHT: "Light"
  DDM_UI_BOUNTY_PRESSURE_STANDARD: "Standard"
  DDM_UI_BOUNTY_PRESSURE_HIGH: "High"
  DDM_UI_BOUNTY_PRESSURE_RELENTLESS: "Relentless"
  DDM_UI_BOUNTY_PRESSURE_OFF_TT: "Disable incoming bounty-hunter confrontations generated by relationship writs against the player. This does not disable ordinary political proscriptions, schemes, imprisonment or war."
  DDM_UI_BOUNTY_PRESSURE_LIGHT_TT: "Allow at most four relationship-writ bounty hunters to confront the player each year."
  DDM_UI_BOUNTY_PRESSURE_STANDARD_TT: "Allow at most eight relationship-writ bounty hunters to confront the player each year."
  DDM_UI_BOUNTY_PRESSURE_HIGH_TT: "Default. Allow a monthly opportunity, up to twelve relationship-writ bounty-hunter attempts per year."
  DDM_UI_BOUNTY_PRESSURE_RELENTLESS_TT: "Allow up to twelve monthly attempts per year but disable the automatic three-year Defied the Writ protection at eight victories. Survivor rewards still progress through VIII."
  DDM_UI_DEFIED_PROTECTION_TITLE: "Defied the Writ Protection"
  DDM_UI_DEFIED_PROTECTION_ON_STATUS: "Eight hunter victories in one year: clear active DDM writs and become immune to relationship-writ bounty hunters for 3 years."
  DDM_UI_DEFIED_PROTECTION_OFF_STATUS: "Eight hunter victories still earn Survivor VIII, but do not clear writs or create three-year immunity."
  DDM_UI_DEFIED_PROTECTION_ON: "Protection On"
  DDM_UI_DEFIED_PROTECTION_OFF: "Protection Off"
  DDM_UI_DEFIED_PROTECTION_ON_TT: "After eight bounty-hunter victories inside one survivor window, clear active relationship/political DDM writs targeting you and make relationship-writ hunters refuse the contract for three years. Ordinary hostility remains possible."
  DDM_UI_DEFIED_PROTECTION_OFF_TT: "Disable the three-year protection reward. Bounty Survivor tiers I–VIII and their ordinary rewards still apply."

