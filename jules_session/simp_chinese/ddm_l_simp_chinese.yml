l_simp_chinese:
 game_rule_category_ddm: "宗族领地管理器"
  decision_group_type_ddm_domain_management_group: "宗族领地管理"
  ddm_domain_management_group: "宗族领地管理"

  ddm_open_manager_decision: "管理宗族领地"
  ddm_open_manager_decision_desc: "开启常设宗族行政机构，统一管理头衔、继承、军事基础设施和家族政策。"
  ddm_open_manager_decision_tooltip: "打开宗族领地公署。各项事务已按部门分组，以便连续处理多项任务而无需重复打开决策。"
  ddm_open_manager_decision_confirm: "进入公署"

  ddm_assess_dynasty_member_interaction: "评估宗族价值"
  ddm_assess_dynasty_member_interaction_desc: "让内廷评估该宗族成员的血统、能力、性情、忠诚度以及在家族中的地位。"
  ddm_protect_dynasty_member_interaction: "保护免受自动化管理"
  ddm_protect_dynasty_member_interaction_desc: "将该宗族成员排除在自动化整理与领地分配行动之外。"
  ddm_unprotect_dynasty_member_interaction: "取消自动化保护"
  ddm_unprotect_dynasty_member_interaction_desc: "允许领地管理器再次对该宗族成员进行常规考量。"
  ddm_favor_for_land_interaction: "优先分封土地"
  ddm_favor_for_land_interaction_desc: "指示宗族公署在有合适头衔可用时强烈优先考虑此人。"
  ddm_never_grant_land_interaction: "绝不分封土地"
  ddm_never_grant_land_interaction_desc: "禁止自动领地管理器向此人授予任何头衔。"
  ddm_clear_land_preference_interaction: "清除土地偏好"
  ddm_clear_land_preference_interaction_desc: "取消在土地分配系统中对此人的特殊优先或排除指令。"
  ddm_protect_holding_interaction: "保护个人地产"
  ddm_protect_holding_interaction_desc: "选择我个人持有的一处伯爵领或次级男爵领并锁定在受保护领地中。过剩分配器绝不会分出手动受保护的地产。此头衔选择器可从我自己的肖像或当前玩家继承人处打开；点击的人物并非接收者。"
  ddm_unprotect_holding_interaction: "取消保护个人地产"
  ddm_unprotect_holding_interaction_desc: "选择我手动受保护的一处地产，恢复其常规优化考量。头衔选择器可从我的肖像或当前玩家继承人处打开。"
  ddm_prioritize_holding_for_distribution_interaction: "优先分出地产"
  ddm_prioritize_holding_for_distribution_interaction_desc: "选择我的一处地产并将其标记为预定放弃土地。除非是首都或后来受到保护，否则过剩管理器会在让出优化器选定的土地之前先放弃此地产。"
  ddm_clear_holding_distribution_priority_interaction: "清除地产分出优先级"
  ddm_clear_holding_distribution_priority_interaction_desc: "选择先前标记为优先分出的地产并移除该指令。"
  ddm_reserve_title_for_recipient_interaction: "为候选人预留头衔"
  ddm_reserve_title_for_recipient_interaction_desc: "选择我的一处直属头衔并为该人物预留。有效的预留会在普通评分之前处理。王室领地保护、首都、宗教头衔限制、阶衔限制以及CK3常规分封合法性依然适用。"
  ddm_clear_title_reservation_interaction: "清除头衔预留"
  ddm_clear_title_reservation_interaction_desc: "选择目前为此人物预留的头衔，恢复其普通按分分配状态。"

  ddm_manager.close: "到此为止。"
  ddm_manager.back: "返回。"
  ddm_manager.main: "返回主公署。"
  ddm_manager.continue_realm: "继续处理领地与头衔。"
  ddm_manager.continue_dynasty: "继续处理宗族与继承。"
  ddm_manager.continue_military: "继续处理军事与建设。"

  # Main compact office
  ddm_manager.0001.t: "宗族领地公署"
  ddm_manager.0001.desc: "公署已划分为多个部门，不必将所有指令挤在一个页面。我的个人直辖领为 #V [GetPlayer.GetDomainSize]#! 处地产，直辖上限为 #V [GetPlayer.GetDomainLimit]#!。我的在世宗族人数为 #V [GetPlayer.MakeScope.Var('ddm_dash_living_dynasty').GetValue|0]#!，其中 #V [GetPlayer.MakeScope.Var('ddm_dash_safe_county_recipients').GetValue|0]#! 人目前符合伯爵领受封规则。

#help 请选择一个部门。现在各项操作都会返回相应的部门而不是关闭界面，因此可以连续下达多条相关指令。#!"
  ddm_manager.0001.a: "领地与头衔"
  ddm_manager.0001.a.flavor: "分配地产、组织等级体系、收回土地，或准确检查阻碍领地计划的原因。"
  ddm_manager.0001.b: "宗族与继承"
  ddm_manager.0001.b.flavor: "围绕继承进行规划、审查家族、刷新同盟，并在继承后清理领地。"
  ddm_manager.0001.c: "军事与建设"
  ddm_manager.0001.c.flavor: "询问军务公署直辖领支持何种军队，并在全领地范围内实施建设方案，无需逐个点击地产。"
  ddm_manager.0001.d: "规则与偏好"
  ddm_manager.0001.d.flavor: "更改土地、继承、同盟、清理以及国库储备政策。"

  # Realm & titles
  ddm_manager.1000.t: "领地与头衔"
  ddm_manager.1000.desc: "我的个人核心领地最先获得保护。任何过剩地产随后会根据感知宣称、领土正统性、能力、政治安全和现有实力，对所有符合条件的宗族成员进行评估。继承状况可以修正评分，但绝不决定受封候选池。"
  ddm_manager.1000.a: "执行完整的宗族交接安置。"
  ddm_manager.1000.a.flavor: "收回符合条件的非宗族头衔，仅放弃我不需要的个人地产，然后将更高级别的头衔置于连贯的宗族层级中。"
  ddm_manager.1000.b: "仅分配我的过剩地产。"
  ddm_manager.1000.b.flavor: "在首次授予前，强制要求我归类任何从未审查过的个人持有伯爵领或次级男爵领：保留、分出，或由公署决定。随后一旦实际直辖领达到上限即停止。"
  ddm_manager.1000.c: "组织公爵领与王国。"
  ddm_manager.1000.c.flavor: "在可能的情况下提拔合适的本地宗族成员，同时避免过度堆砌危险的个人实力。"
  ddm_manager.1000.d: "收回非宗族土地。"
  ddm_manager.1000.d.flavor: "从非宗族统治者手中收回我麾下符合条件的头衔，并立即安置由此产生的过剩土地。"
  ddm_manager.1000.e: "预览领地计划与阻碍因素。"
  ddm_manager.1000.e.flavor: "不做出任何头衔变更。展示管理器可以分配的内容、可能停止的原因，以及最先放弃的地产。"

  ddm_manager.0100.t: "领地已安置"
  ddm_manager.0100.desc: "文书官完成了安置。从非宗族手中收回了 #V [GetPlayer.MakeScope.Var('ddm_last_titles_reclaimed').GetValue|0]#! 个头衔，分配了 #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#! 个次级男爵领和 #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#! 个伯爵领，安置了 #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! 个公爵领、#V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! 个王国和 #V [GetPlayer.MakeScope.Var('ddm_last_empires_granted').GetValue|0]#! 个帝国。

#help 如果我仍超出直辖上限，请使用预览与阻碍报告。它能区分是缺乏可分配地产还是缺乏安全的受封者。#!"
  ddm_manager.0101.t: "过剩地产已分配"
  ddm_manager.0101.desc: "公署开始时在我选定的个人领地之外有 #V [GetPlayer.MakeScope.Var('ddm_last_distribution_start_surplus').GetValue|0]#! 处地产，并排队了 #V [GetPlayer.MakeScope.Var('ddm_last_titles_queued').GetValue|0]#! 处可转让地产。授予了 #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#! 个次级男爵领和 #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#! 个伯爵领，随后安置了 #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! 个公爵领、#V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! 个王国和 #V [GetPlayer.MakeScope.Var('ddm_last_empires_granted').GetValue|0]#! 个帝国。我现在个人持有 #V [GetPlayer.GetDomainSize]#! 处地产；我的受保护领地目标为 #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#!，而原版允许最多 #V [GetPlayer.GetDomainLimit]#! 处。

在紧邻我最高头衔之下的阶衔，公署为我保留了 #V [GetPlayer.MakeScope.Var('ddm_last_top_rank_retained').GetValue|0]#! 个头衔——按每持有伯爵领军事实力计算最强的 40%——并将其余部分通过宗族层级分配。

#help 每人没有固定的伯爵领配额。每个合法合规的宗族成员都可以继续接收土地；直辖规模、同批次封赏和过高军事实力会降低正统性评分，而不会耗尽受封者池。运行仅在我选定的受保护领地目标处或没有未受保护头衔可以机械转让时结束。#!

如果仍有剩余，公署在本次运行后记录了 #V [GetPlayer.MakeScope.Var('ddm_last_baronies_left').GetValue|0]#! 个排队的次级男爵领和 #V [GetPlayer.MakeScope.Var('ddm_last_titles_left').GetValue|0]#! 个排队的伯爵领。"
  ddm_manager.0101.stalled: "

#N 部分未受保护的地产无法机械转让。#! 公署并非有意在原版直辖上限处停止。如果我的个人直辖领仍高于受保护目标，这些属于实际的转让/资格失败，应当予以检查。"
  ddm_manager.0102.t: "高级头衔已排序"
  ddm_manager.0102.desc: "公署安置了 #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! 个公爵领、#V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! 个王国和 #V [GetPlayer.MakeScope.Var('ddm_last_empires_granted').GetValue|0]#! 个帝国。直接位于我自己阶衔之下的头衔享有特殊处理：我保留按每伯爵领军事实力计算最强的 40%，其余 60% 分配给领地正统性最高的宗族成员。较低的中间头衔则向下按层级组织。"
  ddm_manager.0103.t: "非宗族头衔已收回"
  ddm_manager.0103.desc: "公署从宗族之外收回了 #V [GetPlayer.MakeScope.Var('ddm_last_titles_reclaimed').GetValue|0]#! 个符合条件的头衔，随后根据现行领地规则重新分配了个人过剩土地。"

  ddm_manager.1010.t: "领地计划：预览与阻碍因素"
  ddm_manager.1010.desc: "预览模拟了全宗族正统统治者分配。它将受保护的个人地产与可分配的过剩土地区分开来，并展示是否存在机械安全的宗族受封者。继承信号人物仅作为修正因子或用于狭窄的原版封赏门槛绕过。"
  ddm_manager.1010.status_ok: "
#P 无需领地行动：我已处于或低于直辖上限。#!"
  ddm_manager.1010.status_stale_plan: "
#N 需要玩家决策：我当前的直辖上限与上次记录个人领地计划时的上限不一致。DDM将重新开始逐个地产审查，而不是猜测哪些额外地产应当进入或离开我的核心领地。#!"
  ddm_manager.1010.status_unreviewed: "
#N 需要玩家决策：我仍有 #V [GetPlayer.MakeScope.Var('ddm_dash_unclassified_domain_count').GetValue|0]#! 处个人持有的地产从未进行过归类。在明确选择保留、分出或由公署决定之前，DDM不会放弃其中任何一处。#!"
  ddm_manager.1010.status_too_many_locks: "
#N 主要阻碍：硬性保护的地产数量超出了直辖上限的支持能力。在期望管理器达到上限前，请至少移除一个手动锁定或禁用绝对核心保护。#!"
  ddm_manager.1010.status_no_recipient: "
#N 主要阻碍：符合条件的宗族中目前没有合法安全的受封者来接收此过剩头衔。请检查宗族资格、性别法匹配、领地完整性和实力安全设置。#!"
  ddm_manager.1010.status_no_holding: "
#N 主要阻碍：根据当前核心规则，没有个人持有的男爵领或伯爵领可合法分配。绝对核心保护可能是原因所在。#!"
  ddm_manager.1010.status_ready: "
#P 公署拥有可分配土地。#! 每个头衔都将依据家族重视、领地正统性、能力、安全性和现有实力，分配给当时评分最高的合格宗族成员。继承仅作为修正因子。"
  ddm_manager.1010.next_barony: "
优化器接下来将放弃的次级男爵领：#V [ddm_preview_next_barony.GetName]#!。"
  ddm_manager.1010.next_county: "
优化器接下来将放弃的伯爵领：#V [ddm_preview_next_county.GetName]#!。"
  ddm_manager.1010.best_heir: "
当前最高顺位合法继承人：#V [ddm_preview_best_heir.GetName]#!。"
  ddm_manager.1010.second_heir: " 下一位合法继承人候选：#V [ddm_preview_second_heir.GetName]#!。"
  ddm_manager.1010.a: "立即执行过剩领地计划。"
  ddm_manager.1010.a.flavor: "如果我有任何未审查的地产，在封赏前询问如何处理。随后遵循我的受保护核心与分出优先级，优先使用合法分割继承人，并在达到实际直辖上限时停止。"
  ddm_manager.1010.b: "配置受保护领地。"
  ddm_manager.1010.b.flavor: "逐一选择我希望保留的准确地产。优化器可以提供建议，但绝不再用其判断替代玩家的明确选择。"

  ddm_manager.1020.t: "选择我的个人领地"
  ddm_manager.1020.desc: "除非我明确告知，否则公署无法得知我个人关心哪些土地。因此本界面将 #V 我的命令#! 与 #V 优化器的建议#! 区分开来。

#P 按我命令保护：#! [GetPlayer.MakeScope.Var('ddm_dash_manual_core_count').GetValue|0]
#N 优先放弃：#! [GetPlayer.MakeScope.Var('ddm_dash_manual_shed_count').GetValue|0]
#V 明确交由公署：#! [GetPlayer.MakeScope.Var('ddm_dash_manual_neutral_count').GetValue|0]
#V 公署推荐核心：#! [GetPlayer.MakeScope.Var('ddm_dash_auto_core_count').GetValue|0]

#help 我的首都领地始终受保护。最安全的方法是点击第一个按钮：DDM将展示每一处其他个人持有的伯爵领或次级男爵领，并询问我保留、分出还是由公署决定。如果我保护的地产数量恰好等于直辖上限，剩余所有未归类地产将自动标记为待分出。新征服的地产没有归类，因此下一次过剩分配运行会在分封前询问我。#!"
  ddm_manager.1020.a: "逐个选择我的地产。"
  ddm_manager.1020.a.flavor: "重置旧计划并梳理我的个人领地。由我——而非优化器——决定哪些地产是神圣不可侵犯的、可放弃的，或留给行政裁量。"
  ddm_manager.1020.b: "接受公署推荐的核心。"
  ddm_manager.1020.b.flavor: "明确锁定优化器当前最佳地产至我的直辖上限。这是玩家指令，而非自动假设。"
  ddm_manager.1020.c: "保护首都公爵领伯爵领。"
  ddm_manager.1020.c.flavor: "将我首都法理公爵领内所有个人持有的伯爵领添加到受保护核心中。"
  ddm_manager.1020.d: "保护常备军驻扎伯爵领。"
  ddm_manager.1020.d.flavor: "将目前驻扎了我常备军军团的所有个人持有伯爵领添加到受保护核心中。"
  ddm_manager.1020.e: "重置所有地产选择。"
  ddm_manager.1020.e.flavor: "擦除所有保留、分出和交由公署决定的归类，仅保留首都的自动保护。下一次过剩分配运行将再次询问我。"

  ddm_manager.1021.t: "保留还是放弃 [scope:ddm_core_candidate.GetName]？"
  ddm_manager.1021.desc: "这是对 #V [scope:ddm_core_candidate.GetName]#! 的明确命令，而非推测的偏好。

迄今已保护：#V [GetPlayer.MakeScope.Var('ddm_dash_manual_core_count').GetValue|0]#! / 当前直辖上限 #V [GetPlayer.GetDomainLimit]#!。
标记优先放弃：#V [GetPlayer.MakeScope.Var('ddm_dash_manual_shed_count').GetValue|0]#!。
交由公署裁量：#V [GetPlayer.MakeScope.Var('ddm_dash_manual_neutral_count').GetValue|0]#!。

#help 保留会使该地产绝对不可用于自动分配。分出会将其推至过剩队列最前列。由公署决定记录了我特意授权此地产；此时DDM方可利用发展度、建筑、常备军驻扎及其他留存因子来决定其命运。#!"
  ddm_manager.1021.recommend_keep: "
#P 公署建议：保留。#! 根据当前留存公式，该地产位列推荐个人核心之内。"
  ddm_manager.1021.recommend_shed: "
#N 公署建议：可放弃。#! 根据当前留存公式，该地产处于推荐个人核心之外。"
  ddm_manager.1021.maa: "
#V 军事备注：#! 我的一个常备军军团驻扎在此。"
  ddm_manager.1021.capital_duchy: "
#V 核心区域备注：#! 该伯爵领位于我首都的法理公爵领内。"
  ddm_manager.1021.a: "保留 [scope:ddm_core_candidate.GetName]。"
  ddm_manager.1021.a.flavor: "硬性保护此地产。在我持有期间，DDM绝不可将其自动授予他人。"
  ddm_manager.1021.b: "分出 [scope:ddm_core_candidate.GetName]。"
  ddm_manager.1021.b.flavor: "将此地产标记为优先放弃。如果我仍超出直辖上限，DDM应在让出中立地产之前先放弃它。"
  ddm_manager.1021.c: "由公署决定此地产。"
  ddm_manager.1021.c.flavor: "记录我特意将此地产的命运授权给优化器。"
  ddm_manager.1021.d: "由公署决定所有剩余地产。"
  ddm_manager.1021.d.flavor: "停止逐一审查。我未明确保护或命令分出的所有内容都将变为中立，并由优化器评分。"

  ddm_manager.1022.t: "我的领地命令已记录"
  ddm_manager.1022.desc: "公署现在拥有了明确的指令，无需再进行猜测。

#P 受保护地产：#! #V [GetPlayer.MakeScope.Var('ddm_dash_manual_core_count').GetValue|0]#!
#N 优先放弃地产：#! #V [GetPlayer.MakeScope.Var('ddm_dash_manual_shed_count').GetValue|0]#!
#V 授权给优化器：#! #V [GetPlayer.MakeScope.Var('ddm_dash_manual_neutral_count').GetValue|0]#!
当前直辖：#V [GetPlayer.GetDomainSize]#!/#V [GetPlayer.GetDomainLimit]#!。

#help 分配器现在遵循以下命令层级：(1) 绝不让出明确受保护的地产；(2) 首先放弃明确标记为牺牲的地产；(3) 仅对我明确授权的地产，使用优化器的留存公式。新持有的地产为未归类状态，将在下次直接过剩分配前触发此审查。#!"
  ddm_manager.1022.a: "继续执行已记录的领地行动。"
  ddm_manager.1022.a.flavor: "使用我刚记录的个人领地命令，然后恢复引导我来到这里的分配或完整安置行动。"
  ddm_manager.1022.b: "在封赏前预览计划。"
  ddm_manager.1022.b.flavor: "带着这些已记录的准确地产命令返回预览与阻碍因素。"
  ddm_manager.1022.c: "再次审查每一处地产。"
  ddm_manager.1022.c.flavor: "擦除计划并重新开始逐一领地审查。"
  # Dynasty & succession
  ddm_manager.2000.t: "宗族与继承"
  ddm_manager.2000.desc: "继承与封地现在被视为同一系统的组成部分。在均分继承下，默认平衡政策首先将过剩安置限制在CK3的实际合法继承人范围内，随后利用才能、家族重视、性情和公平度来决定每人接收多少。它还可以维持宗族同盟，并在统治者更迭后运行一键清理。

#help 本公署并不替代CK3的继承引擎。它向引擎询问继承人是谁，因此限男性、限女性、剥夺继承权及类似资格规则会自动塑造首选候选池。#!"
  ddm_manager.2000.a: "打开继承简报。"
  ddm_manager.2000.a.flavor: "查看我当前的继承法、主要继承人、预计头衔数量以及领地管理器正在使用的规则。"
  ddm_manager.2000.b: "审查并整理在世宗族。"
  ddm_manager.2000.b.flavor: "单批次评估整个宗族，并从最弱的合格成员开始向上行动。"
  ddm_manager.2000.c: "刷新宗族同盟。"
  ddm_manager.2000.c.flavor: "根据我的同盟政策创建缺失的同盟，而不是在每次封赏后都要求手动外交。"
  ddm_manager.2000.d: "运行继位后清理。"
  ddm_manager.2000.d.flavor: "重新检查我的新个人领地，组织继承的高级头衔，刷新宗族同盟，并准备一份全新的继承报告。"

  ddm_manager.2010.t: "继承总簿"
  ddm_manager.2010.desc: "文书官在角色继承列表中识别出 #V [GetPlayer.MakeScope.Var('ddm_succession_heir_count').GetValue|0]#! 名当前继承人，包括主继承人身后的 #V [GetPlayer.MakeScope.Var('ddm_partition_secondary_heirs').GetValue|0]#! 名次要继承人。
"
  ddm_manager.2010.law_confederate: "
当前领地继承：#V 联盟均分继承。#! #warning 在常规规则允许时，新设立的同阶头衔可能会在死亡时自动创建，因此表面整洁的领地依然可能分裂。#!"
  ddm_manager.2010.law_partition: "
当前领地继承：#V 均分继承。#! 领地在合格继承人之间分割，不会产生联盟均分继承的额外头衔创建。"
  ddm_manager.2010.law_high_partition: "
当前领地继承：#V 高阶均分继承。#! 主继承人获得较大的首份份额，其余部分再行分割。"
  ddm_manager.2010.law_single: "
当前领地继承：#V 单一继承人。#! 在此法律下，均分预留启发式规则的重要性大为降低。"
  ddm_manager.2010.law_other: "
当前继承法不属于本公署识别的标准均分法律之一；报告仅供参考。"
  ddm_manager.2010.heir1: "
第一继承人：#V [ddm_succession_heir_1.GetName]#! — 目前是我持有的 #V [GetPlayer.MakeScope.Var('ddm_primary_heir_expected_titles').GetValue|0]#! 个头衔的继承人。"
  ddm_manager.2010.heir2: "
第二继承人：#V [ddm_succession_heir_2.GetName]#! — 目前是我持有的 #V [GetPlayer.MakeScope.Var('ddm_second_heir_expected_titles').GetValue|0]#! 个头衔的继承人。"
  ddm_manager.2010.heir3: "
第三继承人：#V [ddm_succession_heir_3.GetName]#! — 目前是我持有的 #V [GetPlayer.MakeScope.Var('ddm_third_heir_expected_titles').GetValue|0]#! 个头衔的继承人。"
  ddm_manager.2010.a: "更改继承规划政策。"
  ddm_manager.2010.a.flavor: "决定头衔分配应当忽略继承人、仅保护主继承人、资助次要均分继承人，还是更强烈地偏向主继承。"

  ddm_manager.succession_policy_1: "
领地管理器政策：#V 忽略继承。#! 继承人身份不会影响受封者排名（独立的玩家继承人保护除外）。"
  ddm_manager.succession_policy_2: "
领地管理器政策：#V 保护主继承人。#! 除非手动偏好，主继承人在自动封赏中受到强烈冷落。"
  ddm_manager.succession_policy_3: "
领地管理器政策：#V 平衡均分继承人。#! 我持有头衔的去重当前继承人成为首选池。每次封赏都会根据可遗传资质、成年才能（如适用）、家族重视、政治性情以及当前批次中每已接收一个头衔扣除 #V -65#! 分重新排名。主继承人不会被自动排除，因此两个合格的儿子可以实际分割一份大额过剩地产，而不是一人隐藏在继承人保护之后。"
  ddm_manager.succession_policy_4: "
领地管理器政策：#V 主继承最大化。#! 使用相同的均分感知行为，并带有最强烈的意图将次要继承人资助安排在核心之外。"

  ddm_manager.0104.t: "宗族同盟已刷新"
  ddm_manager.0104.desc: "公署与符合当前同盟政策的有领地宗族成员创建了 #V [GetPlayer.MakeScope.Var('ddm_last_alliances_created').GetValue|0]#! 个新同盟。现有同盟保持原样。"
  ddm_manager.2020.t: "新朝秩序已确立"
  ddm_manager.2020.desc: "继位后处理分配了 #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#! 个次级男爵领和 #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#! 个伯爵领，随后安置了 #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! 个公爵领、#V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! 个王国和 #V [GetPlayer.MakeScope.Var('ddm_last_empires_granted').GetValue|0]#! 个帝国。任何配置的宗族同盟刷新均推迟至次日以单个简明事件执行，而不是在头衔封赏循环内部运行。

#help 这有意设计为一个按钮而非后台自动化：继位可能充满混乱，玩家保留对公署何时重组新朝的最终决定权。#!"
  ddm_manager.2020.a: "阅读最新的继承总簿。"

  # Dynasty review
  ddm_manager.0200.t: "审查在世宗族"
  ddm_manager.0200.desc: "我的每位在世宗族成员均可接受评估——新生儿、孩童、青少年、成年人、有领地或无领地。公署现已使用与行动相同的数值构建了固定名册。

在世 #V [GetPlayer.MakeScope.Var('ddm_purge_living_total').GetValue|0]#! 名宗族成员中，目前有 #V [GetPlayer.MakeScope.Var('ddm_purge_candidate_count').GetValue|0]#! 人被标记待处理。
"
  ddm_manager.purge_stage_1: "
当前标准：#V 保存 — 评分低于 40。#! 只有严重负资产才会落入线外。"
  ddm_manager.purge_stage_2: "
当前标准：#V 宽容 — 评分低于 75。#! 弱势支系将被审查，但普通的有用亲属通常能够存活。"
  ddm_manager.purge_stage_3: "
当前标准：#V 平衡 — 评分低于 110。#! #P 默认。#! 资质平平的平庸成年人无需特殊血统特质即可存活；良好遗传特质使生存愈发容易。"
  ddm_manager.purge_stage_4: "
当前标准：#V 挑选 — 评分低于 155。#! 宗族成员被期望展现出强大的继承资质、实在的治理能力，或令人信服的组合。"
  ddm_manager.purge_stage_5: "
当前标准：#V 高标准 — 评分低于 210。#! 需要强大的能力；无单一特定特质是强制要求的。"
  ddm_manager.purge_stage_6: "
当前标准：#V 精英 — 评分低于 280。#! 期望卓越的继承品质或卓越的履历能力。"
  ddm_manager.purge_stage_7: "
当前标准：#V 巅峰 — 评分低于 360。#! 只有宗族中最具价值的继承、能力与地位组合才有可能达标。"
  ddm_manager.purge_method_1: "
当前行动：#V 仅剥夺继承权。#!"
  ddm_manager.purge_method_2: "
当前行动：#V 剥夺领地头衔，随后剥夺继承权。#!"
  ddm_manager.purge_method_3: "
当前行动：#N 致命整理 — 剥夺符合条件的领地头衔，随后处决。#!"
  ddm_manager.floor_0: "
最小宗族底线：#N 无。#!"
  ddm_manager.floor_4: "
最小宗族底线：#V 4 名在世成员。#!"
  ddm_manager.floor_8: "
最小宗族底线：#V 8 名在世成员。#!"
  ddm_manager.floor_12: "
最小宗族底线：#V 12 名在世成员。#!"
  ddm_manager.0200.a: "选择宗族标准。"
  ddm_manager.0200.a.flavor: "设置在任何人被标记待行动之前评估要求有多高。"
  ddm_manager.0200.b: "选择“整理”的含义。"
  ddm_manager.0200.b.flavor: "将质量门槛与后果区分开来：剥夺继承权、剥夺头衔与继承权，或致命行动。"
  ddm_manager.0200.c: "审查命令并继续。"
  ddm_manager.0200.c.flavor: "在批次行动开始前展示当前候选人数。"

  ddm_manager.0210.t: "设置宗族标准"
  ddm_manager.0210.desc: "公署不再将神圣血统、纯血、天才或任何其他单一特质视为及格/不及格的硬门槛。每位宗族成员获得一个加权总分。对于遗传特质，名册在Paradox提供处复制原版统治者设计师花费；成年才能和家族重视随后分别提供贡献。#P 平衡是默认设置#!，因此新开始的 867 或 1066 宗族不会始于不可能的血统标准之下。"
  ddm_manager.0210.a: "保存 — 门槛 40。"
  ddm_manager.0210.b: "宽容 — 门槛 75。"
  ddm_manager.0210.c: "平衡 — 门槛 110。（默认）"
  ddm_manager.0210.d: "挑选 — 门槛 155。"
  ddm_manager.0210.e: "高标准 — 门槛 210。"
  ddm_manager.0210.f: "精英 — 门槛 280。"
  ddm_manager.0210.g: "巅峰 — 门槛 360。"

  ddm_manager.0220.t: "定义整理行动"
  ddm_manager.0220.desc: "排名体系与针对低于该体系者采取的行动是完全分离的。这使得相同的宗族评估能够指导土地和继承规划，而无需强制采取致命行动。"
  ddm_manager.0220.a: "剥夺门槛下方者的继承权。"
  ddm_manager.0220.b: "剥夺其领地头衔并剥夺继承权。"
  ddm_manager.0220.c: "剥夺其领地头衔并处决。"

  ddm_manager.0230.t: "我面前的名册"
  ddm_manager.0230.desc: "名册在 #V [GetPlayer.MakeScope.Var('ddm_purge_living_total').GetValue|0]#! 名在世宗族成员中包含 #V [GetPlayer.MakeScope.Var('ddm_purge_candidate_count').GetValue|0]#! 名目标。#V [GetPlayer.MakeScope.Var('ddm_purge_standard_survivor_count').GetValue|0]#! 人目前高于所选评分门槛。#V [GetPlayer.MakeScope.Var('ddm_purge_protected_count').GetValue|0]#! 人被排除，因为是我、手动受保护者，或受保护的玩家继承人；#V [GetPlayer.MakeScope.Var('ddm_purge_already_satisfied_count').GetValue|0]#! 人已满足所选后果（例如已剥夺继承权）。

#help 无需任何特定的血统特质。天才贡献 240 点原版统治者设计师点数，聪明 160，敏捷 80；赫拉克勒斯/亚马逊 180，强健 120，健壮 60；倾国倾城 120，英俊/秀丽 80，姣好 40。教育等级贡献其原版的 0/20/40/80/150 成本。成年能力、政治安全和家族重视是独立的上下文衡量指标，而非凭空捏造的“官方特质”权重。#!

#warning 名册在执行前即已固定。在我确认后，行动不会重新计算家族重视并悄悄更改列表。#!"
  ddm_manager.0230.a: "执行宗族审查。"
  ddm_manager.0230.a.flavor: "一条命令即可处理整个合格列表；我不会被迫为每个亲属重复返回菜单。"
  ddm_manager.0230.b: "暂不执行。"

  ddm_manager.0240.t: "宗族审查结束"
  ddm_manager.0240.desc: "命令开始于 #V [GetPlayer.MakeScope.Var('ddm_purge_candidate_count').GetValue|0]#! 名登记目标。公署针对其中 #V [GetPlayer.MakeScope.Var('ddm_last_purged').GetValue|0]#! 人采取了行动。#V [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('ddm_purge_unprocessed_value')|0]#! 人保持未处理状态，通常是因为最小在世宗族底线阻止了整理。任何收回的地产随后归还给常规领地计划。"
  ddm_manager.0240.a: "再次审查宗族公署。"

  ddm_manager.0300.t: "宗族价值评估"
  ddm_manager.0300.desc: "文书官将 [ddm_subject.GetName] 的卷宗呈在我面前。

特质价值：#V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_quality_trait_value')|0]#!
教育价值：#V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_education_trait_value')|0]#!
治理才能：#V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_governance_merit_value')|0]#!
宗族整体价值：#V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_dynastic_value')|0]#!
政治安全：#V [GuiScope.SetRoot(ddm_subject.MakeScope).AddScope('ddm_actor',GetPlayer.MakeScope).ScriptValue('ddm_loyalty_value')|0]#!
家族重视：#V [ddm_subject.MakeScope.Var('ddm_family_regard').GetValue|0]#!

#help 在CK3提供数据处，特质价值对先天/身体特质复制了原版统治者设计师的花费。教育价值同样使用官方教育等级花费：0/20/40/80/150。治理才能随后加入适度的已培养技能组件；CK3没有官方的通用统治者才能公式，因此该部分是明确透明的DDM政策，而非伪装成原版。政治安全读取CK3自己的AI性格轴线——正直、同情、理性、贪婪、报复、果敢与精力——再加上该人物与我的关系。#!"

  # Military & Construction
  ddm_manager.3000.t: "Military & Construction"
  ddm_manager.3000.desc: "The marshal audits the Men-at-Arms I actually maintain by their engine-defined combat families and consults Paradox's own counter-synergy logic before recommending the next role to add. Cultural and special regiments automatically count as their real base type; a Bush Hunter, Longbowman or Vigman is still recognized as an Archer-family regiment without a culture-specific branch. Buildings are considered only after the roster recommendation.\n\n#help DDM no longer turns vanilla AI purchase weights into fake combat scores. Those weights can include large substitution penalties (for example, discouraging generic Bowmen when a cultural Archer is available). The adviser now uses actual roster structure plus vanilla counter-synergy signals.#!"
  ddm_manager.3000.a: "Audit my actual Men-at-Arms roster."
  ddm_manager.3000.a.flavor: "Show the recruitable regiments the office can identify, the literal regiments I already own, the best next addition, and the counter logic behind it."
  ddm_manager.3000.b: "Open the construction office."
  ddm_manager.3000.b.flavor: "Issue one bulk building order across eligible personally held provinces while protecting a treasury reserve."
  ddm_manager.3000.c: "Build around my stationed Men-at-Arms."
  ddm_manager.3000.c.flavor: "Support the regiment actually stationed in each holding first. A roster recommendation is no longer allowed to turn an Archer army into a Stable-building program."

  ddm_manager.3010.t: "Men-at-Arms Roster Audit"
  ddm_manager.3010.desc: "#bold Men-at-Arms roster audit#!\nPersonal regiments scanned: #V [GetPlayer.MakeScope.Var('ddm_maa_personal_regiment_count').GetValue|0]#!.\n\n#bold Combat families currently present#!"

  ddm_manager.3010.plan_archer_pike: "\n\n#P Recommended next role: Pikemen.#!\nYour current roster is Archer-heavy and lacks a Pike-family screen. Paradox's own roster-synergy logic adds value to Pikemen when an Archer core has formed; DDM applies that same relationship one regiment earlier when the ruler is still operating with a tiny three-slot roster. Recruit the #bold best Pike-family unit actually available to your culture#! rather than assuming generic Pikemen are always the best literal unit.\n\n#help This is a roster-structure recommendation, not a claim that every Archer cultural unit has identical counters. Special MaA can differ from their generic family.#!"
  ddm_manager.3010.plan_archer_core: "\n\n#P Recommendation: keep the Archer core and compare actual Archer-family options.#!\nYou already have an Archer core plus Pike cover. Do not diversify merely for symmetry. Prefer the strongest recruitable cultural/special Archer-family regiment available to you, unless a specific enemy or terrain profile gives another family a clear purpose. Reserve later capacity for siege when appropriate."
  ddm_manager.3010.plan_cavalry_answer: "\n\n#P Recommended next role: Heavy Infantry.#!\nYour roster is cavalry-heavy and lacks Heavy Infantry. This follows Paradox's own counter-synergy logic: Heavy Infantry is weighted upward once cavalry dominates the roster. Recruit the strongest Heavy-Infantry-family unit your culture can actually field; DDM does not assume Armored Footmen are superior to a cultural replacement."
  ddm_manager.3010.plan_skirmisher_answer: "\n\n#P Recommended next role: Light Cavalry.#!\nYour roster is Skirmisher-heavy and lacks Light Cavalry. This mirrors vanilla's counter-synergy rule. If your culture has a special Light-Cavalry-family regiment, prefer the actual special option rather than the generic Light Horsemen entry."
  ddm_manager.3010.plan_mixed: "\n\n#P No forced purchase.#!\nThe current roster does not produce a strong vanilla counter-synergy signal. DDM will not invent a numerical winner. Compare the literal recruitable MaA shown in the military panel, favor superior cultural replacements within a needed family, and add siege capacity when the combat roster is sufficiently established.\n\n#help CK3 script can count your real regiment base types and call vanilla script values, but it does not expose every recruitable MaA definition as an iterable runtime object with raw damage, toughness, stack size and counter table. Because of that engine limitation, DDM refuses to fabricate an exact cross-culture stat score for arbitrary future/DLC units.#!"

  ddm_manager.3010.a: "Build holdings around the regiments actually stationed there."
  ddm_manager.3010.a.flavor: "Build infrastructure around the actual regiments stationed in my holdings. The roster audit no longer fabricates a global combat-family score."
  ddm_manager.3010.b: "Open the construction office instead."

  ddm_manager.3100.t: "The Construction Office"
  ddm_manager.3100.desc: "The works office can add tier-I military buildings across my directly held provinces in one order. It only uses free regular building slots, checks the corresponding vanilla terrain/holding requirements used by these building families, and stops spending once the treasury reserve would be crossed.\n"
  ddm_manager.reserve_0: "\nTreasury reserve: #N none.#!"
  ddm_manager.reserve_500: "\nTreasury reserve: #V 500 gold.#!"
  ddm_manager.reserve_1000: "\nTreasury reserve: #V 1,000 gold.#!"
  ddm_manager.reserve_2500: "\nTreasury reserve: #V 2,500 gold.#!"
  ddm_manager.reserve_5000: "\nTreasury reserve: #V 5,000 gold.#!"
  ddm_manager.3100.a: "Run the smart Men-at-Arms building program."
  ddm_manager.3100.a.flavor: "Prefer the regiment stationed in each holding; where none dictates the answer, follow the current realm-wide doctrine."
  ddm_manager.3100.b: "Choose one building type for the whole domain."
  ddm_manager.3100.b.flavor: "For example, order Military Camps everywhere they can legally fit rather than opening every holding by hand."
  ddm_manager.3100.c: "Set the construction treasury reserve."
  ddm_manager.3100.c.flavor: "Bulk construction will stop before spending into this protected amount."

  ddm_manager.3110.t: "Choose a Military Building Program"
  ddm_manager.3110.desc: "The office will scan every directly owned province and add the selected tier-I building wherever a free slot and its normal terrain/holding requirements permit. A province that already has that building line is skipped. The order stops spending at the protected treasury reserve.\n\n#help This is a bulk administrative action: eligible buildings are completed immediately and their base gold cost is charged immediately. It does not create hidden free buildings.#!"
  ddm_manager.3110.a: "Military Camps — ranged foot."
  ddm_manager.3110.a.flavor: "Build Military Camps where eligible to support Archers and Skirmishers."
  ddm_manager.3110.b: "Barracks — heavy foot."
  ddm_manager.3110.b.flavor: "Build Barracks where eligible to support Heavy Infantry and Pikemen."
  ddm_manager.3110.c: "Stables — cavalry."
  ddm_manager.3110.c.flavor: "Build Stables where eligible to support mounted Men-at-Arms."
  ddm_manager.3110.d: "Regimental Grounds — broad support."
  ddm_manager.3110.d.flavor: "Use the more expensive general military building where its terrain requirements permit."

  ddm_manager.3150.t: "Protect the Treasury"
  ddm_manager.3150.desc: "Bulk construction is convenient precisely because it can spend very quickly. The office therefore protects a fixed reserve. Each prospective project checks what remains above that reserve before it is approved."
  ddm_manager.3150.a: "No reserve."
  ddm_manager.3150.b: "Protect 500 gold."
  ddm_manager.3150.c: "Protect 1,000 gold."
  ddm_manager.3150.d: "Protect 2,500 gold."
  ddm_manager.3150.e: "Protect 5,000 gold."

  ddm_manager.3190.t: "The Building Program Completed"
  ddm_manager.3190.desc: "The office completed #V [GetPlayer.MakeScope.Var('ddm_last_buildings_constructed').GetValue|0]#! new military buildings and spent #V [GetPlayer.MakeScope.Var('ddm_last_gold_spent').GetValue|0]#! gold. #V [GetPlayer.MakeScope.Var('ddm_last_build_skipped_no_slots').GetValue|0]#! directly held provinces had no free regular building slot when examined, while #V [GetPlayer.MakeScope.Var('ddm_last_build_skipped_budget').GetValue|0]#! potential projects were halted by the protected treasury reserve.\n\n#help Terrain or holding-type ineligibility is silently skipped; the office will never force Military Camps, Barracks, Stables, or Regimental Grounds into terrain where their requirement trigger rejects them.#!"
  ddm_manager.3190.a: "Continue issuing construction orders."
  ddm_manager.3190.b: "Recalculate the Men-at-Arms doctrine."

  # Rules
  ddm_manager.0400.t: "Rules & Preferences"
  ddm_manager.0400.desc: "The old rules page tried to expose every switch at once. The standing orders are now separated by subject. None of these rules runs in the background; they govern what happens when I deliberately use the office."
  ddm_manager.0400.a: "Land distribution rules."
  ddm_manager.0400.a.flavor: "Eligible relatives, vassal power ceilings, the protected core, and succession-leak risk."
  ddm_manager.0400.b: "继承 & alliance rules."
  ddm_manager.0400.b.flavor: "How heir status changes land ranking, who receives automatic alliances, and whether the player heir is protected."
  ddm_manager.0400.c: "Dynasty-review rules."
  ddm_manager.0400.c.flavor: "Whose opinions count and how small the living dynasty is allowed to become."
  ddm_manager.0400.d: "Construction reserve."
  ddm_manager.0400.d.flavor: "Set how much gold bulk building programs must leave untouched."

  ddm_manager.0460.v19.t: "Recipient & Safety Rules"
  ddm_manager.0460.v19.desc: "These rules shape dynasty-wide rightfulness. Every legally usable dynast remains in the candidate universe; the family-scope choice changes House preference rather than excluding cadet branches. Personal-domain protection lives in the checkbox planner.\n"
  ddm_manager.0460.t: "Land 分配 Rules"
  ddm_manager.0460.desc: "These rules decide who may receive land and which parts of my personal domain the optimizer will sacrifice first.\n"
  ddm_manager.family_scope_1: "\nDynastic preference: #V Strong current-House preference.#! All legally usable cadet branches remain candidates."
  ddm_manager.family_scope_3: "\nDynastic preference: #V Entire Dynasty, with a modest current-House preference.#!"
  ddm_manager.family_scope_2: "\nDynastic preference: #V Entire Dynasty equally, including cadet branches.#!"
  ddm_manager.power_policy_1: "\nPower safety: #V Strict.#!"
  ddm_manager.power_policy_2: "\nPower safety: #V Balanced.#!"
  ddm_manager.power_policy_3: "\nPower safety: #V Relaxed.#!"
  ddm_manager.core_policy_1: "\nCore protection: #V Absolute — capital duchy, stationed-regiment counties, special-building counties, and the capital are never distributed.#!"
  ddm_manager.core_policy_2: "\nCore protection: #V Best-Effort — the capital is absolute; other core counties receive enormous retention priority but can be sacrificed if necessary to reach the limit.#!"
  ddm_manager.realm_integrity_on: "\nRealm-integrity heuristic: #V On — heavily penalize a candidate whose current primary heir is already a landed outsider.#!"
  ddm_manager.realm_integrity_off: "\nRealm-integrity heuristic: #N Off.#!"
  ddm_manager.0460.a: "Set eligible family."
  ddm_manager.0460.b: "Set vassal power safety."
  ddm_manager.0460.c: "Set core-domain protection."
  ddm_manager.0460.d: "Toggle succession-leak protection."

  ddm_manager.0470.t: "继承 & Alliance Rules"
  ddm_manager.0470.desc: "继承 is an influence on rightfulness, not a land-distribution pool. Gender-law alignment can still enforce hard Male Only/Female Only restrictions, while preference laws merely tilt the score. Automatic alliances remain a separate rule."
  ddm_manager.alliance_policy_0: "\nAlliance policy: #N Off.#!"
  ddm_manager.alliance_policy_1: "\nAlliance policy: #V Ally every landed dynasty recipient and all eligible landed dynasty vassals during a refresh.#!"
  ddm_manager.alliance_policy_2: "\nAlliance policy: #V Direct dynastic vassals only.#!"
  ddm_manager.alliance_policy_3: "\nAlliance policy: #V Dynastic dukes and above only.#!"
  ddm_manager.heir_protected: "\nPlayer heir: #V Protected from accidental automatic landing outside Balance Partition Heirs; pruning protection remains active.#!"
  ddm_manager.heir_unprotected: "\nPlayer heir: #N Treated like any other dynasty member.#!"
  ddm_manager.0470.a: "Set succession-planning policy."
  ddm_manager.0470.b: "Set automatic-alliance policy."
  ddm_manager.0470.c: "Toggle player-heir protection."
  ddm_manager.0470.d: "Toggle succession-gender alignment."
  ddm_manager.gender_alignment_on: "\n继承-gender alignment: #V On.#! Male/Female Only hard-filters automatic grants; Male/Female Preference gives the preferred sex a ranking bonus; Equal leaves gender neutral."
  ddm_manager.gender_alignment_off: "\n继承-gender alignment: #N Off.#! Vanilla grant legality still applies, but the manager does not add its own succession-law alignment."

  ddm_manager.0480.t: "Dynasty Review Rules"
  ddm_manager.0480.desc: "These settings control whose opinion contributes to family regard, the minimum living-dynasty safety floor, and an explanation of the weighted merit ledger. No named blood trait has a special pass/fail rule.\n"
  ddm_manager.regard_1: "\nFamily sentiment: #V 关闭 and extended kin plus house/dynasty leadership.#!"
  ddm_manager.regard_2: "\nFamily sentiment: #V Entire living dynasty. #warning This is calculated only when deliberately requested because a very large dynasty requires many opinion checks.#!"
  ddm_manager.0480.a: "Set family-regard depth."
  ddm_manager.0480.b: "Set minimum surviving dynasty size."
  ddm_manager.0480.c: "How is dynastic merit scored?"
  ddm_manager.0481.t: "How the 总簿 Weighs a Life"
  ddm_manager.0481.desc: "There is no single vanilla 'dynastic worth' statistic. For inherited quality, the office therefore uses the game's own Ruler Designer prices as the closest canonical comparison: Quick #V 80#!, Intelligent #V 160#!, Genius #V 240#!; Hale #V 60#!, Robust #V 120#!, Herculean/Amazonian #V 180#!; Comely #V 40#!, Pretty/Handsome #V 80#!, Beautiful #V 120#!; Pure-Blooded, Fecund, Strong and Shrewd #V 50#! each. The corresponding bad intellect and physique tiers count #N -15/-30/-45#!, bad beauty #N -10/-20/-30#!, while Giant is #V +20#!, Dull #N -20#!, Hunchbacked/Spindly/Wheezing #N -10#!, Lisping/Stuttering #N -5#!, Bleeder #N -20#!, Inbred #N -30#! and Weak #N -10#!. Genetic Melancholic/Lunatic/Possessed variants use #N -20/-15/-20#!. Vanilla zero-cost traits remain zero rather than receiving invented penalties.\n\nConsecrated Blood and Divine Blood are fame traits hidden from Ruler Designer, not superior genetic tiers. They therefore receive only small social values matching their vanilla effects instead of overwhelming the ledger.\n\nFor adults, demonstrated merit is added separately from traits: Diplomacy x2, Martial x2, Stewardship x3, Intrigue x1.5, Learning x2 and Prowess x0.5. Children receive a neutral developmental baseline plus modest parental-potential signals because their finished skills do not yet exist. Family regard contributes 15% to pruning value; title-grant ranking gives family consensus additional weight, and existing claims, political safety, succession need and de-jure coherence also matter.\n\n#help The trait prices are vanilla data. Education is not separately added at its Ruler Designer price because its skill bonuses already feed Governance Merit; doing both would double-count it. Personality traits likewise feed Political Safety through CK3's own AI personality axes. The skill multipliers, child-development rule, score thresholds and conversion of AI temperament into one political-safety number are DDM policy choices because CK3 supplies no universal ruler-merit formula.#!"
  ddm_manager.0481.a: "Return to the review rules."
  ddm_manager.0240.stalled: "\n#N Warning: the scripted selector stalled with registered targets remaining. If this appears, the error log should identify a scope/list failure.#!"

  ddm_manager.0410.t: "Who May Receive the Realm?"
  ddm_manager.0410.desc: "Cadet branches remain part of the dynasty. I can restrict settlement to my current House, use the whole dynasty while preferring my House, or treat every house equally."
  ddm_manager.0410.a: "Current House only."
  ddm_manager.0410.b: "Whole Dynasty — favor my House."
  ddm_manager.0410.c: "Whole Dynasty — equal treatment."

  ddm_manager.0420.t: "How Much Power Is Safe?"
  ddm_manager.0420.desc: "The office compares prospective vassals against my military strength and limits how much personal land each can accumulate. No rule can make rebellion literally impossible, but stricter settings create more, weaker dynasty rulers rather than a few oversized ones."
  ddm_manager.0420.a: "Strict — fragment power aggressively."
  ddm_manager.0420.b: "Balanced — preserve coherence without creating monsters."
  ddm_manager.0420.c: "Relaxed — allow stronger regional princes."

  ddm_manager.0430.t: "Whose Opinion Counts?"
  ddm_manager.0430.desc: "Family regard measures how the selected family circle currently feels about each candidate, and it influences both survival and elevation. 关闭-kin mode is much cheaper to calculate. Full-dynasty mode asks how every living dynast feels about every candidate before a deliberate review or mass land settlement. This is a selection-consensus measure, not a fabricated blanket opinion bonus: direct grants still apply CK3's normal received-title opinion to the recipient."
  ddm_manager.0430.a: "Use close and extended family."
  ddm_manager.0430.b: "Use the entire living dynasty."

  ddm_manager.0440.t: "The Minimum Living Dynasty"
  ddm_manager.0440.desc: "Even a very harsh standard can stop before the dynasty is hollowed out. The batch review ceases as soon as the selected floor would be crossed. Manually protected characters are never targeted."
  ddm_manager.0440.a: "No safety floor."
  ddm_manager.0440.b: "Never fall below 4 living members."
  ddm_manager.0440.c: "Never fall below 8 living members."
  ddm_manager.0440.d: "Never fall below 12 living members."

  ddm_manager.0450.t: "How Absolute Is the Core?"
  ddm_manager.0450.desc: "Absolute protection can make the domain limit mathematically unreachable. Best-Effort protection instead scores the capital duchy, stationed Men-at-Arms, special buildings, military infrastructure, and development as things to retain for as long as possible. The realm capital is always untouchable."
  ddm_manager.0450.a: "Absolute Core — never touch protected counties."
  ddm_manager.0450.b: "Best-Effort Core — reach the limit if possible."

  ddm_manager.0490.t: "继承 Influence"
  ddm_manager.0490.desc: "继承 does not determine who may receive conquered land. Neutral ignores inheritance in the allocation score; Respect Current Heir gives the current heir of a title a modest bonus; Preserve Primary Estate modestly deprioritizes the primary heir while they are expected to inherit the protected core."
  ddm_manager.0490.a: "继承 neutral."
  ddm_manager.0490.b: "Protect the primary heir."
  ddm_manager.0490.c: "Balance all legal partition heirs."
  ddm_manager.0490.d: "Maximize the primary inheritance."

  ddm_manager.0491.t: "Automatic Dynastic 同盟"
  ddm_manager.0491.desc: "A title grant does not need to end with another round of manual diplomacy. Choose how broadly the office should create alliances after grants and during alliance refreshes."
  ddm_manager.0491.a: "Do not create alliances automatically."
  ddm_manager.0491.b: "Ally all landed dynastic recipients."
  ddm_manager.0491.c: "Ally direct dynastic vassals only."
  ddm_manager.0491.d: "Ally dynastic dukes and above only."

  ddm_manager.3010.has_skirmishers: "\n• Skirmisher-family regiments present."
  ddm_manager.3010.has_archers: "\n• Archer-family regiments present."
  ddm_manager.3010.has_pikemen: "\n• Pikemen-family regiments present."
  ddm_manager.3010.has_heavy_infantry: "\n• Heavy-Infantry-family regiments present."
  ddm_manager.3010.has_light_cavalry: "\n• Light-Cavalry-family regiments present."
  ddm_manager.3010.has_heavy_cavalry: "\n• Heavy-Cavalry-family regiments present."
  ddm_manager.3010.has_archer_cavalry: "\n• Archer-Cavalry-family regiments present."
  ddm_manager.3010.has_camel_cavalry: "\n• Camel-Cavalry-family regiments present."
  ddm_manager.3010.has_elephant_cavalry: "\n• Elephant-Cavalry-family regiments present."
  ddm_manager.3010.has_gunpowder: "\n• Gunpowder-family regiments present."
  ddm_manager.3010.has_siege: "\n• Siege-weapon regiments present."
  ddm_manager.3010.plan_heavy_infantry_answer: "\n\n#P Recommended next role: Archers.#!\nYour roster is Heavy-Infantry-heavy and lacks an Archer-family complement. This is the same counter-synergy relationship vanilla uses. Prefer the best actual cultural/special Archer option available to your ruler."
  ddm_manager.3010.plan_gunpowder: "\n\n#P Gunpowder opportunity detected.#!\nVanilla gives gunpowder an unusually high strategic weight because access is constrained. Treat this as a strong candidate when it is genuinely recruitable, but do not disband a functioning core merely to chase the signal."
  ddm_manager.3010.plan_siege: "\n\n#P Consider reserving the next slot for siege.#!\nYour combat roster is established and no siege regiment is present. Siege weapons do not replace battlefield counters, but they can shorten wars enough to justify a dedicated slot once the fighting core is stable."
  # Domain-management workflow
  ddm_manager.1000.desc_v19: "This page contains the settings that govern my next land distribution. I personally hold #V [GetPlayer.GetDomainSize]#! holdings; vanilla permits #V [GetPlayer.GetDomainLimit]#!, but my confirmed protected-domain target is #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#!. The distributor sheds every unprotected holding until that chosen target is reached.\n\n"
  ddm_manager.1000.policy_balanced: "继承 influence: #P Neutral#! — the whole eligible dynasty competes by perceived rightfulness, territorial fit, merit, safety and existing power."
  ddm_manager.1000.policy_follow: "继承 influence: #V Respect Current Heir#! — the whole dynasty still competes, but the current CK3 heir of a title receives a modest legitimacy bonus."
  ddm_manager.1000.policy_estate: "继承 influence: #V Preserve Primary Estate#! — the primary heir is modestly deprioritized because they are expected to inherit the protected personal core."
  ddm_manager.1000.v19_edit: "Edit Personal Domain"
  ddm_manager.1000.v19_edit.flavor: "Open one scrollable checkbox list of every personal holding. Checked means MINE; unchecked means surplus."
  ddm_manager.1000.v19_distribute: "Distribute Surplus"
  ddm_manager.1000.v19_distribute.flavor: "Settle every holding outside the confirmed personal core until I reach my chosen protected-domain target, then organize duchies and kingdoms automatically."
  ddm_manager.1000.v19_preview: "Preview 分配"
  ddm_manager.1000.v19_preview.flavor: "Show who is projected to receive the surplus and why before transferring anything."
  ddm_manager.1000.v19_policy: "分配 Rules"
  ddm_manager.1000.v19_policy.flavor: "Change dynastic preference, power concentration, succession influence, alliance policy, family-regard depth, gender-law alignment, and realm-integrity rules without leaving Realm & Titles."
  ddm_manager.1000.v19_more: "More Realm Tools"

  ddm_manager.1010.v19.t: "Proposed Dynastic 分配"
  ddm_manager.1010.v19.desc: "Surplus to place: #V [GetPlayer.MakeScope.Var('ddm_preview_surplus').GetValue|0]#! holdings. The preview successfully allocated #V [GetPlayer.MakeScope.Var('ddm_preview_allocated').GetValue|0]#! in simulation. 继承-signaled dynasts available for modifier purposes: #V [GetPlayer.MakeScope.Var('ddm_last_partition_heirs_available').GetValue|0]#!.\n\nThe office judges the entire eligible dynasty. Family regard is the primary social-legitimacy signal; claims, de-jure position, current holdings, merit, political safety and prior grants shape each title-specific choice. There is no everyone-gets-one quota.\n\n#N Before distributing: #V [GetPlayer.MakeScope.Var('ddm_warn_top_tier_titles').GetValue|0]#! of my titles sit at my own tier. Granting one of those away can make the recipient independent or hand them a disproportionate share of my levies.#!\n\n#P My religious head title is protected and will never be distributed. Protection active: #V [GetPlayer.MakeScope.Var('ddm_warn_faith_protected').GetValue|0]#!.#!"
  ddm_manager.1010.v19.policy_balanced: "\n#P 继承 influence: Neutral.#! 继承 does not change the dynasty-wide rightfulness judgment."
  ddm_manager.1010.v19.policy_follow: "\n#V 继承 influence: Respect Current Heir.#! A title's current heir receives a modest bonus, not ownership of the recipient pool."
  ddm_manager.1010.v19.policy_estate: "\n#V 继承 influence: Preserve Primary Estate.#! The primary heir is modestly penalized before inheriting the protected core."
  ddm_manager.1010.v19.recipient1: "\n\n#V [scope:ddm_preview_recipient_1.GetName]#! — projected #V [GetPlayer.MakeScope.Var('ddm_preview_r1_grants').GetValue|0]#! holdings. Inheritable quality: [GetPlayer.MakeScope.Var('ddm_preview_r1_quality').GetValue|0]; merit/education: [GetPlayer.MakeScope.Var('ddm_preview_r1_merit').GetValue|0]; political safety: [GetPlayer.MakeScope.Var('ddm_preview_r1_loyalty').GetValue|0]; family regard: [GetPlayer.MakeScope.Var('ddm_preview_r1_family').GetValue|0]."
  ddm_manager.1010.v19.recipient2: "\n#V [scope:ddm_preview_recipient_2.GetName]#! — projected #V [GetPlayer.MakeScope.Var('ddm_preview_r2_grants').GetValue|0]#! holdings. Inheritable quality: [GetPlayer.MakeScope.Var('ddm_preview_r2_quality').GetValue|0]; merit/education: [GetPlayer.MakeScope.Var('ddm_preview_r2_merit').GetValue|0]; political safety: [GetPlayer.MakeScope.Var('ddm_preview_r2_loyalty').GetValue|0]; family regard: [GetPlayer.MakeScope.Var('ddm_preview_r2_family').GetValue|0]."
  ddm_manager.1010.v19.recipient3: "\n#V [scope:ddm_preview_recipient_3.GetName]#! — projected #V [GetPlayer.MakeScope.Var('ddm_preview_r3_grants').GetValue|0]#! holdings. Inheritable quality: [GetPlayer.MakeScope.Var('ddm_preview_r3_quality').GetValue|0]; merit/education: [GetPlayer.MakeScope.Var('ddm_preview_r3_merit').GetValue|0]; political safety: [GetPlayer.MakeScope.Var('ddm_preview_r3_loyalty').GetValue|0]; family regard: [GetPlayer.MakeScope.Var('ddm_preview_r3_family').GetValue|0]."
  ddm_manager.1010.v19.shortfall: "\n\n#N Preview warning: not every surplus holding found a recipient in the simulation.#! Review recipient rules before executing."
  ddm_manager.1010.v19.execute: "Approve This 分配"
  ddm_manager.1010.v19.edit: "Edit Personal Domain"
  ddm_manager.1010.v19.policy: "分配 Rules"

  ddm_manager.1012.t: "Personal Domain Confirmed"
  ddm_manager.1012.desc: "My personal estate now contains #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#! protected holdings. That—not the vanilla limit of #V [GetPlayer.GetDomainLimit]#!—is where automatic settlement stops. Every other personally held holding is surplus, including new conquests, until I deliberately change the protected estate."
  ddm_manager.1012.a: "Preview the proposed distribution."
  ddm_manager.1012.b: "Distribute the surplus now."

  ddm_manager.1030.t: "Additional Realm Tools"
  ddm_manager.1030.desc: "These are useful but less frequent operations, kept off the main land-management page so the everyday workflow stays short."
  ddm_manager.1030.a: "Organize higher titles."
  ddm_manager.1030.b: "Reclaim eligible non-dynastic titles."
  ddm_manager.1030.c: "Run the full dynastic settlement."

  ddm_manager.0490.v19.t: "继承 Influence on Rightfulness"
  ddm_manager.0490.v19.desc: "继承 never defines who may receive conquered land. The entire eligible dynasty is judged by perceived rightfulness and territorial fit. This setting only changes how much the current inheritance picture modifies that score. Male/Female Only remains a hard legal filter when gender-law alignment is enabled."
  ddm_manager.0490.v19.a: "继承 Neutral — Default"
  ddm_manager.0490.v19.a.flavor: "Ignore succession when placing surplus. Family regard, territorial legitimacy, capability, political safety and existing power decide who is most rightful."
  ddm_manager.0490.v19.b: "Respect Current Heir"
  ddm_manager.0490.v19.b.flavor: "Give the current CK3 heir of the specific title a modest legitimacy bonus. Claims, territory, family regard and safety can still produce another ruler."
  ddm_manager.0490.v19.c: "Preserve Primary Estate"
  ddm_manager.0490.v19.c.flavor: "Modestly deprioritize the primary heir while they are expected to inherit the protected personal estate. Junior heirs receive only a small legitimacy signal; neither group owns the candidate pool."

  ddm_manager.0470.v19.desc: "继承 influence is changed from Realm & Titles, where it is visible beside the Distribute button. It modifies rightfulness but never replaces the dynasty-wide recipient pool. This advanced page keeps alliance and gender-alignment rules."
  ddm_manager.0470.v19.policy: "Open 继承 Influence"

  ddm_manager.2010.v19.desc: "The clerks identify #V [GetPlayer.MakeScope.Var('ddm_succession_heir_count').GetValue|0]#! current heirs, including #V [GetPlayer.MakeScope.Var('ddm_partition_secondary_heirs').GetValue|0]#! behind the primary heir. The ledger now bounds-checks each displayed heir and counts expected titles by inspecting my held titles' current_heir directly; it no longer manufactures a duplicate third heir when only two exist.\n\n"
  ddm_manager.2010.v19.policy_balanced: "Land-manager succession influence: #P Neutral#!."
  ddm_manager.2010.v19.policy_follow: "Land-manager succession influence: #V Respect Current Heir#!."
  ddm_manager.2010.v19.policy_estate: "Land-manager succession influence: #V Preserve Primary Estate#!."

  ddm_manager.0110.t: "The Dynastic Compact"
  ddm_manager.0110.desc: "A day has passed since the settlement. The office has now performed one consolidated alliance refresh under the standing policy and created #V [GetPlayer.MakeScope.Var('ddm_last_alliances_created').GetValue|0]#! missing dynastic alliances. Land distribution itself no longer pauses to create alliances recipient by recipient."
  ddm_manager.0110.a: "Record the compact and return to Realm & Titles."

  ddm_manager.1050.t: "分配 Rules"
  ddm_manager.1050.desc: "These are the rules that directly shape who receives conquered land. They now live beside Distribute Surplus instead of being buried in the general administration menus. Click a rule to cycle its setting.\n"
  ddm_manager.1050.family: "Cycle Dynastic Preference"
  ddm_manager.1050.power: "Cycle Power-Concentration Policy"
  ddm_manager.1050.succession: "Cycle 继承 Influence"
  ddm_manager.1050.alliance: "Cycle Post-Settlement Alliance Policy"
  ddm_manager.1050.advanced: "Eligibility & Perception Rules"

  ddm_manager.1051.t: "Eligibility & Perception Rules"
  ddm_manager.1051.desc: "These secondary distribution rules determine whose opinions count, how succession gender law affects eligibility, and whether foreign-heir leakage is penalized. Click a rule to toggle or cycle it.\n"
  ddm_manager.1051.regard: "Cycle Family-Regard Depth"
  ddm_manager.1051.gender: "Toggle Gender-Law Alignment"
  ddm_manager.1051.integrity: "Toggle Realm-Integrity Protection"

  # Personal Domain Planner scripted GUI
  DDM_DOMAIN_PLANNER_TITLE: "Personal Domain Planner"
  DDM_DOMAIN_PLANNER_CANCEL: "Cancel"
  DDM_DOMAIN_PLANNER_DESC: "The holdings marked here form the 王室领地. They remain in my hand when the Domain Office settles newly acquired lands. My capital is always reserved."
  DDM_DOMAIN_PLANNER_COUNT: "Selected: [GetPlayer.MakeScope.Var('ddm_planner_selected_count').GetValue|0] / [GetPlayer.MakeScope.Var('ddm_planner_target_count').GetValue|0]    Personal holdings found: [GetPlayer.MakeScope.Var('ddm_planner_total_count').GetValue|0]"
  DDM_DOMAIN_PLANNER_HINT: "The office will continue granting surplus until only the reserved estate remains."
  DDM_DOMAIN_PLANNER_RECOMMEND: "Use Office Recommendation"
  DDM_DOMAIN_PLANNER_RECOMMEND_TT: "Select the strongest personal holdings by capital status, development, stationed Men-at-Arms, special buildings and military infrastructure. I can change any checkbox afterward."
  DDM_DOMAIN_PLANNER_MAA: "Protect Stationed MAA"
  DDM_DOMAIN_PLANNER_MAA_TT: "Add every personally held holding with a stationed Men-at-Arms regiment to the selected core. If this exceeds the domain limit, uncheck the least important selection before confirming."
  DDM_DOMAIN_PLANNER_CAPITAL_DUCHY: "Protect Capital Duchy"
