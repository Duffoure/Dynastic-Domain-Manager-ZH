  DDM_UI_PAGE_MY_MARRIAGE: "我的内廷"
  DDM_UI_PAGE_MY_MARRIAGE_TT: "Open the ruler Household Office: switch between marriage and harem mode, manage numbered concubines, recognize one consort for spouse-style skill assistance, and sort children by their concubine of origin."
  DDM_UI_MY_MARRIAGE_TITLE: "我的内廷"
  DDM_UI_MY_MARRIAGE_FLAVOR: "The ruler household is a DDM register layered over CK3 relationships. Harem mode never divorces, marries or changes faith doctrine: spouses, native concubines and manually enrolled court members can all receive permanent household numbers for lineage records. 继承 is managed separately below."
  DDM_UI_MY_MARRIAGE_NOTE: "This page scans only you. Harem mode changes DDM household membership only; it never changes vanilla marriage/concubinage, dynasty-wide Marry All, anyone else's household, or faith doctrine."
  DDM_UI_PAGE_RECORDS: "总簿"
  DDM_UI_SIDEBAR_NOTE: "The office remembers its orders. Change a rule only when the realm itself should change."

  DDM_UI_OVERVIEW_TITLE: "State of the Realm"
  DDM_UI_OVERVIEW_FLAVOR: "Before the seals are set and the charters dispatched, the clerks lay the realm before me: what belongs to the Crown, what awaits a ruler, and how widely my house has been planted."
  DDM_UI_OVERVIEW_CROWN: "The 王室领地"
  DDM_UI_OVERVIEW_CROWN_STATS: "个人领地： #V [GetPlayer.MakeScope.Var('ddm_dash_personal_domain').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_dash_domain_limit').GetValue|0]#! legal limit    王室领地目标： #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#!\n可分配伯爵领： #V [GetPlayer.MakeScope.Var('ddm_dash_distributable_counties').GetValue|0]#!    次级男爵领： #V [GetPlayer.MakeScope.Var('ddm_dash_distributable_baronies').GetValue|0]#!"
  DDM_UI_OVERVIEW_REALM: "The High Titles"
  DDM_UI_OVERVIEW_REALM_STATS: "Duchies: #V [GetPlayer.MakeScope.Var('ddm_dash_held_duchies').GetValue|0]#!    Kingdoms: #V [GetPlayer.MakeScope.Var('ddm_dash_held_kingdoms').GetValue|0]#!    Empires: #V [GetPlayer.MakeScope.Var('ddm_dash_held_empires').GetValue|0]#!\n直属封臣： #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_count').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_limit').GetValue|0]#! limit    Managed top-rank estate: #V [GetPlayer.MakeScope.Var('ddm_dash_managed_top_rank').GetValue|0]#!"
  DDM_UI_OVERVIEW_DYNASTY: "The Dynasty"
  DDM_UI_OVERVIEW_DYNASTY_STATS: "在世宗族成员： #V [GetPlayer.MakeScope.Var('ddm_dash_living_dynasty').GetValue|0]#!    有领地宗族成员： #V [GetPlayer.MakeScope.Var('ddm_dash_landed_dynasty').GetValue|0]#!\nLanded rulers outside the dynasty: #V [GetPlayer.MakeScope.Var('ddm_dash_non_dynasty_rulers').GetValue|0]#!"
  DDM_UI_SETTLE: "Settle the Realm"
  DDM_UI_SETTLE_TT: "Distribute every unreserved personal holding down to the 王室领地 target, then organize duchies and kingdoms according to the standing hierarchy and recipient rules."
  DDM_UI_SETTLE_AFTER_WAR: "Settle After the War"
  DDM_UI_SETTLE_AFTER_WAR_TT: "Record a standing settlement order. The office will wait until the realm is at peace, then either execute automatically or reopen the 王室领地 if the personal-domain plan needs confirmation."
  DDM_UI_SETTLEMENT_QUEUED: "Settlement Queued"
  DDM_UI_SETTLEMENT_QUEUED_TT: "The office is waiting for the current war to end before carrying out the standing settlement order."
  DDM_UI_PREVIEW: "Read the Proposed Grants"
  DDM_UI_PREVIEW_TT: "Prepare a non-destructive projection using the same recipient pool and rightfulness scoring as the live settlement."
  DDM_UI_PREVIEW_READY_TOAST: "Proposed grants prepared — opening the 总簿."
  DDM_UI_RECORDS_PREVIEW_GRANTS: "Proposed Title Grants"
