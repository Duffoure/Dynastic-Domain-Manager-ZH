  DDM_UI_OUTSIDER_INVARIANT: "#P Outsider grants are respected by default.#! The 非宗族地产 page may protect individual counties permanently or authorize reclamation of the rest."

  DDM_UI_ESTATE_TITLE: "The 王室领地"
  DDM_UI_ESTATE_FLAVOR: "These are the lands I reserve to my own hand. The Domain Office may entrust every other personal holding to a suitable ruler, but it will not cross the boundary I draw here."
  DDM_UI_ESTATE_COUNT: "Reserved: #V [GetPlayer.MakeScope.Var('ddm_planner_selected_count').GetValue|0]#! of #V [GetPlayer.MakeScope.Var('ddm_planner_target_count').GetValue|0]#! permitted holdings    •    Personal holdings found: #V [GetPlayer.MakeScope.Var('ddm_planner_total_count').GetValue|0]#!"
  DDM_UI_ESTATE_RECOMMEND: "Steward's Choice"
  DDM_UI_ESTATE_MAA: "Army Seats"
  DDM_UI_ESTATE_CAPITAL: "Capital Duchy"
  DDM_UI_ESTATE_CLEAR: "Clear"
  DDM_UI_ESTATE_CANCEL: "Discard Changes"
  DDM_UI_ESTATE_SAVE: "Record the 王室领地"
  DDM_UI_ESTATE_SAVE_TT: "Save these holdings as the permanent stopping point for settlement. If settlement sent me here, the clerks will resume their work immediately afterward."
  DDM_UI_SORT_LABEL: "Order:"
  DDM_UI_SORT_HIERARCHY: "De Jure A-Z"
  DDM_UI_SORT_HIERARCHY_TT: "Group holdings through their live de-jure Empire, Kingdom, and Duchy, then order the underlying vanilla county titles alphabetically. Reverse flips the complete hierarchy. Dynamically renamed/custom titles retain their underlying title identity for stable sorting."
  DDM_UI_SORT_DEVELOPMENT: "Development"
  DDM_UI_SORT_FAITH: "Faith"
  DDM_UI_SORT_CULTURE: "Culture"
  DDM_UI_SORT_REVERSE: "Reverse"
  DDM_UI_SORT_REVERSE_TT: "Reverse the current holding order. De Jure A-Z reverses the complete grouped hierarchy; Development is numeric; Faith and Culture group matching counties first and use development within the group."

  DDM_UI_DISTRIBUTION_TITLE: "Law of 分配"
  DDM_UI_DISTRIBUTION_FLAVOR: "A grant is not a lottery and it is not an inheritance rehearsal. For each unsettled title, the office asks which eligible ruler can most plausibly hold it: by standing, territory, claims, ability, loyalty, safety and the balance of the realm."
  DDM_UI_DISTRIBUTION_DYNASTIC_PREF: "Whose Branch Carries Preference"
  DDM_UI_FAMILY_HOUSE_ONLY: "#V House First#! — the whole dynasty remains eligible, but members of my own House receive the strongest preference."
  DDM_UI_FAMILY_HOUSE_PREFERRED: "#P House Preferred#! — the whole dynasty is eligible, with a moderate preference for my own House."
  DDM_UI_FAMILY_DYNASTY_EQUAL: "#V Dynasty Equal#! — every House of the dynasty begins on equal footing."
  DDM_UI_FAMILY_SET_1: "House First"
  DDM_UI_FAMILY_SET_3: "Prefer My House"
  DDM_UI_FAMILY_SET_2: "Whole Dynasty"
  DDM_UI_POWER_TITLE: "Concentration of Power"
  DDM_UI_POWER_1: "#P Restrained#! — strongly favors smaller and landless rulers."
  DDM_UI_POWER_2: "#V Balanced#! — existing strength matters, but territorial right can outweigh it."
  DDM_UI_POWER_3: "#N Permissive#! — powerful rulers may grow further when their territorial case is strongest."
  DDM_UI_POWER_SET_1: "Restrained"
  DDM_UI_POWER_SET_2: "Balanced"
  DDM_UI_POWER_SET_3: "Permissive"
  DDM_UI_PERCEPTION_TITLE: "Perception & Eligibility"
  DDM_UI_REGARD_CLOSE: "关闭-Family Regard"
  DDM_UI_REGARD_DYNASTY: "Dynasty-Wide Regard"
  DDM_UI_GENDER_TOGGLE: "Gender Alignment"
  DDM_UI_INTEGRITY_TOGGLE: "Realm Integrity"
  DDM_UI_REGARD_CURRENT_CLOSE: "Family regard: #V close and extended family#! are consulted."
  DDM_UI_REGARD_CURRENT_DYNASTY: "Family regard: #V the living dynasty#! is consulted."
  DDM_UI_GENDER_ON: "Gender law: #P aligned#! with the realm's active succession law."
  DDM_UI_GENDER_OFF: "Gender law: #V ignored#! for automatic-grant eligibility."
  DDM_UI_INTEGRITY_ON: "Realm integrity: #P guarded#! against obvious foreign-heir leakage."
  DDM_UI_INTEGRITY_OFF: "Realm integrity: #V not considered#! in recipient scoring."
  DDM_UI_DISTRIBUTION_RULES_TITLE: "How Settlement Chooses Rulers"
  DDM_UI_DISTRIBUTION_RULES: "#V 1.#! The 王室领地 is never crossed.  #V 2.#! Direct title reservations are honored first when legal; selected non-dynastic priorities then receive first-pass priority for one legal county grant while land remains.  #V 3.#! Every title is then scored separately: claims, de-jure position and existing local control are strongest; capability, loyalty and social regard follow.  #V 4.#! Existing domain size, excessive military concentration and grants already received in this settlement reduce the score.  #V 5.#! Duchies and kingdoms favor rulers who already control their de-jure land. 继承 changes the score; it does not dictate the result."
  DDM_UI_EXISTING_GRANTS: "#P Protected outsider counties are never reclaimed.#! Unprotected outsider estates are touched only when the 非宗族地产 policy explicitly permits it."

  DDM_UI_HIERARCHY_TITLE: "The Realm's Hierarchy"
  DDM_UI_HIERARCHY_FLAVOR: "Counties make the body of the realm; duchies and kingdoms give it shape. The office raises local rulers where the territorial case is strongest while preserving the Crown's proper share of the rank immediately beneath mine."
  DDM_UI_HIERARCHY_HELD: "In my hand now: #V [GetPlayer.MakeScope.Var('ddm_dash_held_duchies').GetValue|0]#! duchies and #V [GetPlayer.MakeScope.Var('ddm_dash_held_kingdoms').GetValue|0]#! kingdoms."
  DDM_UI_HIERARCHY_CROWN_RULE: "When I am an #V Emperor#!, the Crown retains roughly #V 40%#! of the managed kingdoms; when I am a #V King#!, it retains roughly #V 40%#! of the managed duchies. The strongest titles by military strength per county are reserved first.\n\nManaged estate: #V [GetPlayer.MakeScope.Var('ddm_dash_managed_top_rank').GetValue|0]#!    Intended Crown share: #V [GetPlayer.MakeScope.Var('ddm_dash_top_rank_target').GetValue|0]#!"
  DDM_UI_HIERARCHY_VASSAL_LIMIT: "#BOLD Direct-vassal administration#!\n直属封臣： #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_count').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_limit').GetValue|0]#! limit    Over limit: #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_overage').GetValue|0]#!\n#weak This is separate from the personal Domain Limit. Moving a vassal beneath a proper liege changes reporting lines; it does not change who owns the land.#!"
  DDM_UI_HIERARCHY_PROPER_LAST: "Last proper-liege pass: #V [GetPlayer.MakeScope.Var('ddm_last_proper_liege_transfers').GetValue|0]#! direct vassals transferred."
  DDM_UI_HIERARCHY_LAST: "Last hierarchy pass: #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! duchies, #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! kingdoms and #V [GetPlayer.MakeScope.Var('ddm_last_empires_granted').GetValue|0]#! empires granted; #V [GetPlayer.MakeScope.Var('ddm_last_top_rank_retained').GetValue|0]#! top-rank titles retained."
  DDM_UI_HIERARCHY_RUN: "Order the High Titles"
  DDM_UI_HIERARCHY_RUN_TT: "Re-run only the duchy/kingdom hierarchy pass. County holders are left where they are."
  DDM_UI_HIERARCHY_PROPER_LIEGES: "Distribute to Proper Lieges"
  DDM_UI_HIERARCHY_PROPER_LIEGES_TT: "Reduce direct-vassal clutter without changing title ownership. The office checks each direct count, duke, and king against the live de-jure hierarchy and transfers that ruler beneath the nearest legal de-jure liege already serving directly under me. It skips wars, full vassal limits, special administrative family titles, incompatible government transfers, and any case where I personally am already the proper liege."

  DDM_UI_DYNASTY_TITLE: "The Recipient Pool"
  DDM_UI_DYNASTY_FLAVOR: "The dynasty remains the ordinary governing class, but the Crown may deliberately admit non-dynastic courtiers awaiting their first grant and established vassals already in the realm. I choose the eligible field here; the allocator still decides which title each candidate has the strongest claim to hold unless I reserve a specific title."
  DDM_UI_DYNASTY_STATS: "在世宗族成员： #V [GetPlayer.MakeScope.Var('ddm_dash_living_dynasty').GetValue|0]#!    有领地宗族成员： #V [GetPlayer.MakeScope.Var('ddm_dash_landed_dynasty').GetValue|0]#!\nEligible non-dynastic candidates listed: #V [GetPlayer.MakeScope.Var('ddm_outsider_recipient_total').GetValue|0]#!"
  DDM_UI_DYNASTY_OUTSIDERS: "There are #V [GetPlayer.MakeScope.Var('ddm_dash_non_dynasty_rulers').GetValue|0]#! landed rulers outside the dynasty beneath me. Their counties may be individually protected under #V 非宗族地产#!; all others can remain respected or be reclaimed under the standing policy."
  DDM_UI_DYNASTY_REVIEW_NOTE: "Dynastic standards and the destructive review system remain available as a specialist office while that subsystem is migrated into this window."
  DDM_UI_RECIPIENT_SCOPE_TITLE: "Who May Receive New Grants"
  DDM_UI_RECIPIENT_SCOPE_DYNASTY_CURRENT: "Current field: #P Dynasty Only#!. Non-dynastic courtiers and vassals are not considered for ordinary new grants; direct title reservations remain explicit exceptions."
  DDM_UI_RECIPIENT_SCOPE_SELECTED_CURRENT: "Current field: #V Selected Candidates#!. Only checked non-dynastic courtiers or vassals join the dynastic pool."
  DDM_UI_RECIPIENT_SCOPE_ALL_CURRENT: "Current field: #N All Eligible Candidates#!. Every legal non-dynastic courtier or vassal may compete; checked candidates receive first-pass priority for one legal grant."
  DDM_UI_RECIPIENT_SCOPE_DYNASTY: "Dynasty Only"
  DDM_UI_RECIPIENT_SCOPE_SELECTED: "Selected Candidates"
  DDM_UI_RECIPIENT_SCOPE_ALL: "All Eligible"
  DDM_UI_RECIPIENT_PRIORITY_NOTE: "Check a non-dynastic candidate to give that person first-pass priority for #V one legal county grant#!. This does not hard-assign a county: ordinary scoring still chooses the best territorial fit. #V Right-click a candidate and use Reserve a Title#! when I want a specific county, duchy, or kingdom bound to that person."
  DDM_UI_RECIPIENT_PRIORITY_TT: "Priority candidate. In Selected Candidates mode, only checked non-dynastic candidates enter ordinary allocation. In All Eligible mode, everyone listed may compete, but checked candidates are strongly prioritized until their first legal county grant of the settlement. Direct title reservations are processed first."
  DDM_UI_RECIPIENT_REFRESH: "Refresh Candidates"
  DDM_UI_DYNASTY_REVIEW: "Open Dynastic Review"
  DDM_UI_DYNASTY_RECLAIM: "Manage 非宗族地产"
  DDM_UI_DYNASTY_RECLAIM_TT: "Choose which outsider-held counties are protected, decide whether ordinary settlement may reclaim the rest, or issue a reclamation immediately."

  DDM_UI_OUTSIDERS_TITLE: "非宗族地产"
  DDM_UI_OUTSIDERS_FLAVOR: "Not every worthy servant bears my blood. A checked county is a grant the Crown has chosen to honor; an unchecked county remains beyond the dynasty only so long as the standing policy permits it."
  DDM_UI_OUTSIDERS_STATS: "Outsider counties recorded: #V [GetPlayer.MakeScope.Var('ddm_outsider_county_total').GetValue|0]#!    Protected: #P [GetPlayer.MakeScope.Var('ddm_outsider_county_protected').GetValue|0]#!    Unprotected: #N [GetPlayer.MakeScope.Var('ddm_outsider_county_reclaimable').GetValue|0]#!"
  DDM_UI_OUTSIDERS_POLICY_TITLE: "Standing Reclamation Policy"
  DDM_UI_OUTSIDERS_POLICY_RESPECT_CURRENT: "Current order: #P Respect all outsider grants#!. Unchecked counties remain untouched during ordinary settlement."
  DDM_UI_OUTSIDERS_POLICY_RECLAIM_CURRENT: "Current order: #N Reclaim unprotected outsider estates#! when the realm is settled."
  DDM_UI_OUTSIDERS_POLICY_RESPECT: "Respect All"
  DDM_UI_OUTSIDERS_POLICY_RESPECT_TT: "Ordinary settlement leaves every existing outsider holder in place. Protection checkmarks are retained for any later change of policy."
  DDM_UI_OUTSIDERS_POLICY_RECLAIM: "Reclaim Unprotected"
  DDM_UI_OUTSIDERS_POLICY_RECLAIM_TT: "Settle the Realm will first return every unprotected outsider county to the Crown, preserve the former holder's claims, and then redistribute the resulting surplus. Checked counties remain untouched."
  DDM_UI_OUTSIDERS_PROTECT_ALL: "Protect All"
  DDM_UI_OUTSIDERS_PROTECT_ALL_TT: "Mark every outsider-held county currently listed as a respected grant."
  DDM_UI_OUTSIDERS_CLEAR_ALL: "Clear Protections"
  DDM_UI_OUTSIDERS_CLEAR_ALL_TT: "Remove protection from every outsider-held county currently listed. This does not reclaim anything until a reclamation order is issued."
  DDM_UI_OUTSIDERS_REFRESH: "Refresh List"
  DDM_UI_OUTSIDERS_REFRESH_TT: "Rebuild the list and its totals from the realm as it exists now."
  DDM_UI_OUTSIDERS_LIST_NOTE: "Check the counties that are to remain outside the dynasty. Protection belongs to the county itself and survives inheritance. After individual changes, Refresh List updates the totals above."
  DDM_UI_OUTSIDERS_CHECKBOX_TT: "Checked: this county is a protected outsider grant and cannot be reclaimed by DDM. Unchecked: it is eligible only when reclamation is explicitly enabled or ordered."
  DDM_UI_OUTSIDERS_RECLAIM_NOW: "Reclaim Unprotected Now"
  DDM_UI_OUTSIDERS_RECLAIM_NOW_TT: "Open a final warning, then reclaim only the unprotected outsider estates. Claims are preserved, and the returned land remains in the 王室领地 until you explicitly order Settle the Realm."

  DDM_UI_SUCCESSION_TITLE: "继承 & Rightfulness"
  DDM_UI_SUCCESSION_FLAVOR: "继承 may color a grant, but it does not choose the governing class. The active recipient pool remains the field; inheritance is only one argument among many about who appears rightful."
  DDM_UI_SUCCESSION_HEIRS: "Current heirs identified by the succession ledger: #V [GetPlayer.MakeScope.Var('ddm_succession_heir_count').GetValue|0]#!."
  DDM_UI_SUCCESSION_NEUTRAL: "#P Neutral#! — succession contributes nothing to grant priority."
  DDM_UI_SUCCESSION_HEIR: "#V Respect Current Heir#! — the current heir of a title receives a modest legitimacy bonus."
  DDM_UI_SUCCESSION_ESTATE: "#V Preserve Primary Estate#! — the primary heir is modestly deprioritized before inheriting the 王室领地."
  DDM_UI_SUCCESSION_SET_1: "Neutral"
  DDM_UI_SUCCESSION_SET_2: "Respect Heir"
  DDM_UI_SUCCESSION_SET_3: "Preserve Estate"
  DDM_UI_SUCCESSION_CLEANUP: "Settle a New Reign"
  DDM_UI_SUCCESSION_CLEANUP_TT: "Run the ordinary settlement and succession briefing after a ruler change. Outsider holdings follow the standing 非宗族地产 policy, and protected counties are never reclaimed."

  DDM_UI_ALLIANCES_TITLE: "The Dynastic Compact"
  DDM_UI_ALLIANCES_FLAVOR: "同盟 are concluded after the land has settled, not while hundreds of charters are still being written. The office waits a day, then records the compact in one event."
  DDM_UI_ALLIANCE_OFF: "#V Off#! — no automatic dynastic alliances."
  DDM_UI_ALLIANCE_ALL: "#P All Landed Dynasts#! — eligible landed dynasts are joined to the compact."
  DDM_UI_ALLIANCE_DIRECT: "#V Direct Vassals#! — only dynastic rulers directly beneath me."
  DDM_UI_ALLIANCE_HIGH: "#V Dukes & Above#! — only the upper dynastic hierarchy."
  DDM_UI_ALLIANCE_SET_0: "Off"
  DDM_UI_ALLIANCE_SET_1: "All Dynasts"
  DDM_UI_ALLIANCE_SET_2: "Direct Vassals"
  DDM_UI_ALLIANCE_SET_3: "Dukes+"
  DDM_UI_ALLIANCE_LAST: "Last compact: #V [GetPlayer.MakeScope.Var('ddm_last_alliances_created').GetValue|0]#! alliances concluded."
  DDM_UI_ALLIANCE_NOTIFICATION_NOTE: "#P Grant-opinion and alliance effects now execute as hidden mechanics.#! The intended visible report is the single Dynastic Compact event on the following day, rather than a wall of Relations Improved / Alliance notices during settlement."

  DDM_UI_TOOLS_TITLE: "其他公署"
  DDM_UI_TOOLS_FLAVOR: "The daily work of land and title settlement now lives in this ledger. Rarer military, dynastic and administrative operations remain available without crowding the principal pages."
  DDM_UI_TOOL_DYNASTY: "Dynastic Review"
  DDM_UI_TOOL_MILITARY: "Military Office"
  DDM_UI_TOOL_ADMIN: "Administrative Policies"
  DDM_UI_TOOL_RECLAIM: "非宗族地产"
  DDM_UI_TOOLS_LEGACY_NOTE: "Some specialist offices still use the older event presentation. They remain isolated from the land-distribution workflow so they can be migrated without destabilizing the allocator."

  DDM_UI_RECORDS_TITLE: "The Office 总簿"
  DDM_UI_RECORDS_FLAVOR: "The clerks record what the office actually did. This is where mechanical detail belongs; the 王室领地 and policy pages are kept for orders, not debugging prose."
  DDM_UI_RECORDS_LAST_SETTLEMENT: "Last Settlement"
  DDM_UI_RECORDS_SETTLEMENT: "Counties granted: #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#!    Baronies granted: #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#!\nDuchies granted: #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#!    Kingdoms: #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#!    Empires: #V [GetPlayer.MakeScope.Var('ddm_last_empires_granted').GetValue|0]#!\nUnsettled counties: #V [GetPlayer.MakeScope.Var('ddm_last_titles_left').GetValue|0]#!    Unsettled baronies: #V [GetPlayer.MakeScope.Var('ddm_last_baronies_left').GetValue|0]#!"
  DDM_UI_RECORDS_STALLED: "#N The last settlement stopped with transferable land remaining.#! The ledger found no valid recipient for at least one remaining title under the current rules."
  DDM_UI_RECORDS_PREVIEW: "Current Projection"
