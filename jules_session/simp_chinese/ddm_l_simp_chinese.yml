  # Prime Education
  DDM_UI_PRIME_TITLE:0 "Prime Education"
  DDM_UI_PRIME_FLAVOR:0 "Engineer the upbringing of the current child ruler—or, for an adult ruler, the current child player heir. Choose the kind of personality I want encouraged, then search diplomatic range for the strongest teacher for every education track. Prime scoring follows the game's relevant-skill/Learning relationship, values intelligence, and rewards well-rounded teachers rather than raw specialization alone."
  DDM_UI_PRIME_NO_SUBJECT:0 "There is no child ruler or child player heir to plan for right now."
  DDM_UI_PRIME_SUBJECT:0 "Education subject: #V [GetPlayer.MakeScope.Var('ddm_prime_subject').GetCharacter.GetShortUINameNoTooltip]#! — age [GetPlayer.MakeScope.Var('ddm_prime_subject').GetCharacter.GetAge]"
  DDM_UI_PRIME_OLD_SAVE_NOTE:0 "Already used #V I'm Just a Baby#!? Nothing is regenerated. Prime Education simply evaluates the court you already received—including its Tutor—against every better candidate currently within diplomatic range."
  DDM_UI_PRIME_TEMPERAMENT_TITLE:0 "Desired Temperament"
