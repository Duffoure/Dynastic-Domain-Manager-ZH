  DDM_UI_PRIME_TEMPERAMENT_PRAGMATIC_CURRENT:0 "Current plan: #V Pragmatic#! — favor broadly useful ruler traits regardless of moral flavor."
  DDM_UI_PRIME_TEMPERAMENT_RUTHLESS_CURRENT:0 "Current plan: #N Ruthless#! — favor forceful, coercive and intrigue-friendly traits."
  DDM_UI_PRIME_VIRTUOUS:0 "Virtuous"
  DDM_UI_PRIME_PRAGMATIC:0 "Pragmatic"
  DDM_UI_PRIME_RUTHLESS:0 "Ruthless"
  DDM_UI_PRIME_VIRTUOUS_TT:0 "Raises teachers with Diligent, Patient, Just, Temperate, Calm, Honest, Compassionate and similar traits in the ranking. This influences which guardian DDM chooses; it cannot guarantee which personality events the child receives."
  DDM_UI_PRIME_PRAGMATIC_TT:0 "Raises teachers with mechanically useful ruler traits such as Diligent, Ambitious, Patient, Calm, Temperate and Brave. This influences guardian choice rather than forcing personality outcomes."
  DDM_UI_PRIME_RUTHLESS_TT:0 "Raises teachers with Ambitious, Brave, Vengeful, Deceitful, Callous, Sadistic and similar traits. This influences guardian choice rather than forcing personality outcomes."
  DDM_UI_PRIME_GENERATE:0 "Generate Best Teachers"
