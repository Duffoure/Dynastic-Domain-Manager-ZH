  # Dynasty Review
  DDM_UI_MATCH_TITLE: "Dynastic Marriage Planner"
  DDM_UI_MATCH_FLAVOR: "Plan marriages and betrothals before adulthood, then act when the match is legal. Rank candidates by stronger children, love + children, or love itself; DDM uses CK3's own marriage/betrothal rules for the final arrangement."
  DDM_UI_MATCH_HOW_TO_USE: "#V How to use:#! Children can be planned before adulthood. Choose Priority + kinship → review candidates with Next Match or run Complete Dynasty Scan → inspect Dynasty Plan → Arrange Match. Adult controlled pairs can marry immediately; minor pairs open CK3's betrothal UI. Hover any control for details."
  DDM_UI_MATCH_STATS: "Eligible dynasts: #V [GetPlayer.MakeScope.Var('ddm_match_eligible_count').GetValue|0]#!  •  recommended matches found on this page: #V [GetPlayer.MakeScope.Var('ddm_match_found_count').GetValue|0]#!"
  DDM_UI_MATCH_PRIORITY_TITLE: "Marriage Priority"
  DDM_UI_MATCH_PRIORITY_CHILDREN_CURRENT: "Current default: #V Best Children#!"
  DDM_UI_MATCH_PRIORITY_BALANCED_CURRENT: "Current default: #V Love + Good Children#!"
  DDM_UI_MATCH_PRIORITY_LOVE_CURRENT: "Current default: #V Love Match#!"
  DDM_UI_MATCH_PRIORITY_CHILDREN: "Best Children"
  DDM_UI_MATCH_PRIORITY_BALANCED: "Balanced"
  DDM_UI_MATCH_PRIORITY_LOVE: "Love Match"
  DDM_UI_MATCH_PRIORITY_CHILDREN_TT: "Prioritize congenital quality and reinforcement. Adult candidates also use current fertility, reproductive runway and skills; child candidates are not judged by unfinished adult stats. This is an expected-outcome heuristic, not a promise of exact unborn traits or stats."
  DDM_UI_MATCH_PRIORITY_BALANCED_TT: "Keep child quality important while also rewarding existing relationships, opinion, friendship and cultural/faith compatibility. Mutual adult attraction and Dominion partner preferences are considered only when both characters are adults."
  DDM_UI_MATCH_PRIORITY_LOVE_TT: "Let affection dominate. Existing relationships, friendship and opinion rank strongly; mutual sexual attraction is scored only for adult pairs. Child quality remains a smaller tie-breaker."
  DDM_UI_MATCH_DYNASTY_TITLE: "Kinship Strategy"
  DDM_UI_MATCH_DYNASTY_AVOID_CURRENT: "Current strategy: #V Avoid 关闭 Kin#!"
  DDM_UI_MATCH_DYNASTY_ALLOW_CURRENT: "Current strategy: #V Allow Dynasty Matches#!"
  DDM_UI_MATCH_DYNASTY_PURE_CURRENT: "Current strategy: #V Pure-Blood Program#!"
  DDM_UI_MATCH_DYNASTY_AVOID: "Avoid Kin"
  DDM_UI_MATCH_DYNASTY_ALLOW: "Allow Dynasty"
  DDM_UI_MATCH_DYNASTY_PURE: "Pure-Blood"
  DDM_UI_MATCH_DYNASTY_AVOID_TT: "Exclude close and extended relatives from DDM recommendations. Distant members of the same dynasty may still appear when CK3 considers them valid marriage options."
  DDM_UI_MATCH_DYNASTY_ALLOW_TT: "Allow same-dynasty and close/extended-family candidates whenever CK3 itself says the marriage is selectable. Kinship still receives a visible risk penalty in the child score."
  DDM_UI_MATCH_DYNASTY_PURE_TT: "Recommend only same-dynasty candidates. Pure-Blooded and reinforced positive congenital lines receive major weight, while close-kin risk remains visible and penalized. This does not bypass faith incest rules."
  DDM_UI_MATCH_NOTE: "#help Uses CK3's legal marriage/betrothal pool. Minors can be planned whenever the loaded game considers the pairing valid. Children of a Dominion-Owned subject are also treated as under the Patron's family authority: legal adult matches can be imposed directly and legal minor matches become real betrothals. Other external matches keep CK3's normal proposal rules.#!"
  DDM_UI_MATCH_SUBJECT_NAME: "#V [Character.GetShortUINameNoTooltip]#! — age [Character.GetAge]"
  DDM_UI_MATCH_SCORE_SCALE_TT: "The denominator is a reference scale for readability, not a hard cap. Total uses the selected priority's weighted reference; Children uses 2500 and Love uses 1320. Other mods can push raw values above these references."
  DDM_UI_MATCH_SELECTED: "#P Match [Character.MakeScope.Var('ddm_match_selected_slot').GetValue|0] of [Character.MakeScope.Var('ddm_match_sel_count').GetValue|0]:#! [Character.MakeScope.Var('ddm_match_sel').GetCharacter.GetShortUINameNoTooltip]  •  total #V [Character.MakeScope.Var('ddm_match_sel_score').GetValue|0]/[Character.MakeScope.Var('ddm_match_sel_score_max').GetValue|0]#!  •  children #V [Character.MakeScope.Var('ddm_match_sel_genetic').GetValue|0]/2500#!  •  love #V [Character.MakeScope.Var('ddm_match_sel_love').GetValue|0]/1320#!"
  DDM_UI_MATCH_FIRST: "1. [Character.MakeScope.Var('ddm_match_best').GetCharacter.GetShortUINameNoTooltip] — total [Character.MakeScope.Var('ddm_match_best_score').GetValue|0]/[Character.MakeScope.Var('ddm_match_best_score_max').GetValue|0]"
  DDM_UI_MATCH_SECOND: "2. [Character.MakeScope.Var('ddm_match_second').GetCharacter.GetShortUINameNoTooltip] — total [Character.MakeScope.Var('ddm_match_second_score').GetValue|0]/[Character.MakeScope.Var('ddm_match_second_score_max').GetValue|0]"
  DDM_UI_MATCH_THIRD: "3. [Character.MakeScope.Var('ddm_match_third').GetCharacter.GetShortUINameNoTooltip] — total [Character.MakeScope.Var('ddm_match_third_score').GetValue|0]/[Character.MakeScope.Var('ddm_match_third_score_max').GetValue|0]"
  DDM_UI_MATCH_CYCLE: "Next Match"
  DDM_UI_MATCH_CYCLE_TT: "Step through this dynast's recommendations: best, second, third, then back to best. The portrait, scores and Arrange Match action all follow the recommendation you are viewing. Cycling reads the cached scan, so it costs nothing."
  DDM_UI_MATCH_MARRY: "Arrange Match"
  DDM_UI_MATCH_MARRY_TT: "Arrange the selected pair. Two controlled adults can be married immediately. If either person is a minor, or the other side is external, DDM opens CK3's Arrange Marriage screen with the pair already selected so the loaded game handles betrothal, acceptance and terms."
  DDM_UI_MATCH_MARRY_BLOCKED: "No action"
  DDM_UI_MATCH_MARRY_BLOCKED_TT: "The selected pair is no longer actionable under the loaded game's current marriage/betrothal rules. Refresh the planner if a marriage, betrothal, imprisonment, death or other status change made this cached recommendation stale."
  DDM_MATCH_PROPOSAL_OPENED_TOAST: "Marriage/betrothal arrangement opened for [ROOT.Char.GetShortUINameNoTooltip]"
  DDM_UI_MATCH_DIRECTION_NORMAL: "normal order"
  DDM_UI_MATCH_DIRECTION_REVERSED: "reversed"
  DDM_UI_MATCH_FILTERS: "Order: #V [GetPlayer.Custom('ddm_match_sort_name')]#!, [GetPlayer.Custom('ddm_match_direction_name')]  •  Priority: #V [GetPlayer.Custom('ddm_match_policy_name')]#!  •  Kinship: #V [GetPlayer.Custom('ddm_match_kinship_name')]#!"
  DDM_UI_MATCH_PAIR_FILTERS: "Plan order: #V [GetPlayer.Custom('ddm_match_pair_sort_name')]#!, [GetPlayer.Custom('ddm_match_pair_direction_name')]  •  Priority: #V [GetPlayer.Custom('ddm_match_policy_name')]#!  •  Kinship: #V [GetPlayer.Custom('ddm_match_kinship_name')]#!"
  DDM_UI_MATCH_SORT_PRIORITY_TT: "Order the dynasty by the office's marriage priority: your heir first, then close family, weighted by dynastic value, with a bonus for anyone 35 or under. Your own marriage is kept separate under Best Match for Me so Marry All never decides it for you."
  DDM_UI_MATCH_SORT_DYNASTIC_TT: "Order by dynastic value alone — rank, titles and standing — ignoring age and the office's priority weighting."
  DDM_UI_MATCH_SORT_AGE_TT: "Order by age, oldest first. Reverse puts the youngest first."
  DDM_UI_MATCH_SORT_FERTILITY_TT: "Order by the dynast's own fertility, highest first."
  DDM_UI_MATCH_SORT_SKILLS_TT: "Order by the dynast's total skills across all five attributes, highest first."
  DDM_UI_MATCH_SORT_REVERSE_TT: "Flip the current order. The weakest or youngest end of the dynasty comes to the front, which is the quick way to find who has been left unmatched."
  DDM_UI_MATCH_PAIR_SORT_TOTAL_TT: "Order the Dynasty Plan by each pair's combined match score under the current priority."
  DDM_UI_MATCH_PAIR_SORT_CHILDREN_TT: "Order the planned pairs by expected child quality alone, whatever the current priority is."
  DDM_UI_MATCH_PAIR_SORT_LOVE_TT: "Order the planned pairs by affection alone: existing relationships, attraction, opinion and compatibility."
  DDM_UI_MATCH_PAIR_SORT_KINSHIP_TT: "Order the planned pairs by how closely related the two people are, so consanguinity risk sorts to one end."
  DDM_UI_MATCH_NONE: "No selectable marriage or betrothal candidate satisfies the current planner strategy."
  DDM_UI_MATCH_KIN_NONE: "Kinship: unrelated / no dynastic relation detected."
  DDM_UI_MATCH_KIN_DYNASTY: "Kinship: same dynasty, but not close or extended family."
