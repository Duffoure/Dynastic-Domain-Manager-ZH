  DDM_UI_PRIME_SCAN_STATS:0 "Candidates examined: #V [GetPlayer.MakeScope.Var('ddm_prime_candidate_total').GetValue|0]#!. Prime score = relevant education skill ×2 + Learning + intelligence + temperament fit + a modest well-roundedness bonus."
