  DDM_UI_GRAND_CAPITULATION_TITLE: "Grand Capitulation"
  DDM_UI_GRAND_CAPITULATION_DESC: "Once I personally hold three Kingdom crowns, I can send one ultimatum to independent rulers within diplomatic range: bend the knee and surrender the bulk of their estate, or refuse. Refusal does not guarantee war; only refusers who believe organized resistance can actually beat me may form a coalition."
  DDM_UI_GRAND_CAPITULATION: "Demand Universal Submission"
  DDM_UI_GRAND_CAPITULATION_TT: "The requirement panel shows exactly why this button is available or blocked. Peaceful submitters surrender about 80% of liquid standing and eligible titles, suffer a legitimacy collapse, and become vassals when CK3 rank/government rules permit. The ten strongest refusers are compared at their full combined quality-adjusted strength; wider refusal adds only a modest organization bonus, and actual coalition membership is still rolled ruler by ruler. Grand Capitulation preserves my existing government even if surrendered crowns raise my rank."
  DDM_UI_CAP_REQ_LANDED_OK: "#P Met: Landed#!"
  DDM_UI_CAP_REQ_LANDED_NO: "#N Missing: Landed#!"
  DDM_UI_CAP_REQ_FREE_OK: "#P Met: Free#!"
  DDM_UI_CAP_REQ_FREE_NO: "#N Missing: Free#!"
  DDM_UI_CAP_REQ_PEACE_OK: "#P Met: At peace#!"
  DDM_UI_CAP_REQ_PEACE_NO: "#N Missing: At peace#!"
  DDM_UI_CAP_REQ_CROWNS_OK: "#P Met: Kingdom crowns [GetPlayer.MakeScope.Var('ddm_cap_ui_kingdom_count').GetValue|0]/3#!"
  DDM_UI_CAP_REQ_CROWNS_NO: "#N Missing: Kingdom crowns [GetPlayer.MakeScope.Var('ddm_cap_ui_kingdom_count').GetValue|0]/3#!"
  DDM_UI_CAP_REQ_COOLDOWN_OK: "#P Met: No cooldown#!"
  DDM_UI_CAP_REQ_COOLDOWN_NO: "#N Blocked: Cooldown active#!"

  ddm_manager.5100.t: "Bend the Knee — or Be Bent"
  ddm_manager.5100.desc: "Three crowns are enough to stop pretending my authority ends at the border. My emissaries can ride to every eligible independent ruler within diplomatic range with one message: submit now, surrender the bulk of the estate and enter my order — or refuse me publicly.\n\nThose who yield give roughly #bold 80%#! of their Gold, Prestige, Piety and transferable personal titles, suffer a severe Legitimacy collapse, and are reduced below my crown where necessary so they can become my vassals. Capitals, Heads of Faith, Noble Family identity titles and landless institutional titles are protected. My existing government is preserved even if surrendered crowns raise my rank.\n\n#warning Refusal does not automatically mean war.#! The ten militarily strongest refusers are measured by troop strength, Martial, Prowess and elite knights. Their full combined effective power is compared with mine; a large number of refusers adds a modest organization bonus, then individual rulers still decide whether to join any coalition that forms."
  ddm_manager.5100.a: "Send the emissaries. All of them."
  ddm_manager.5100.a.flavor: "Let every nearby throne decide whether pride is worth a battlefield."
  ddm_manager.5100.b: "Not yet."

  ddm_manager.5101.t: "The Crowns Answer"
  ddm_manager.5101.desc: "The emissaries have returned. #V [ROOT.Char.MakeScope.Var('ddm_cap_target_count').GetValue|0]#! independent rulers received the ultimatum. #V [ROOT.Char.MakeScope.Var('ddm_cap_titles_taken').GetValue|0]#! personal titles changed hands during peaceful capitulation."
  ddm_manager.5101.submitted: "\n\n#P [ROOT.Char.MakeScope.Var('ddm_cap_submitter_count').GetValue|0] rulers submitted.#! Their treasuries and political standing are broken, and where rank permits they now sit beneath my crown."
  ddm_manager.5101.refused: "\n\n#N [ROOT.Char.MakeScope.Var('ddm_cap_refuser_count').GetValue|0] rulers refused.#! The ten strongest fielded #V [ROOT.Char.MakeScope.Var('ddm_cap_coalition_benchmark').GetValue|0]#! combined quality-adjusted effective strength against my #V [ROOT.Char.MakeScope.Var('ddm_cap_effective_strength').GetValue|0]#!. The breadth of refusal added #V +[ROOT.Char.MakeScope.Var('ddm_cap_breadth_bonus').GetValue|0]#! percentage points to their organization roll."
  ddm_manager.5101.coalition: "\n\n#N This time, refusal became organization.#! #V [ROOT.Char.MakeScope.Var('ddm_cap_coalition_member_count').GetValue|0]#! rulers joined a single coalition war with #V [ROOT.Char.MakeScope.Var('ddm_cap_coalition_raw_total').GetValue|0]#! raw military strength at assembly. Better-quality resistance may mass to roughly 175% of my raw strength; equal or worse quality may compensate with numbers up to roughly 225%."
  ddm_manager.5101.no_coalition: "\n\nThey refused — but nobody managed to turn anger into a credible united front. Sometimes the safest rebellion is the one nobody volunteers to begin."
  ddm_manager.5101.none: "\n\nNo eligible independent ruler within diplomatic range could receive the demand."
  ddm_manager.5101.a: "Let the new order settle."

  DDM_GRAND_CAP_COALITION_WAR_NAME: "War Against Universal Submission"
  DDM_GRAND_CAP_COALITION_VICTORY_DESC: "If the coalition wins, the Grand Capitulation project is humiliated: the defender loses major Prestige and Legitimacy, the cooldown lengthens, and recent peaceful submitters may break free."
  DDM_GRAND_CAP_COALITION_WHITE_PEACE_DESC: "White peace preserves existing peaceful submissions but damages the would-be hegemon's Prestige and delays another universal demand."
  DDM_GRAND_CAP_COALITION_DEFEAT_DESC: "If the coalition loses, its surviving independent participants are forced through a harsher capitulation and suffer additional political humiliation."
  DDM_GRAND_CAP_COALITION_INVALIDATED_DESC: "The coalition war ends because one of its principal rulers can no longer sustain the conflict."
